<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phòng Lab Vật Lý — HỌC ĐỂ LÀM GÌ?</title>
<script src="/firebase-config.js"></script>
<script src="/auth.js"></script>
<style>

:root{
  --bg:#070c1a; --bg2:#0b1326; --panel:#0f1a31; --panel2:#14213d; --raise:#1b2a4b;
  --line:rgba(148,180,255,.16); --line2:rgba(148,180,255,.28);
  --text:#eef3ff; --muted:#9fb0d0; --dim:#6f82a8;
  --accent:#38bdf8; --accent2:#0ea5e9; --accent-soft:rgba(56,189,248,.12);
  --gold:#fbbf24; --gold-soft:rgba(251,191,36,.14);
  --ok:#34d399; --ok-soft:rgba(52,211,153,.12);
  --warn:#fb923c; --warn-soft:rgba(251,146,60,.14);
  --bad:#f87171; --bad-soft:rgba(248,113,113,.14);
  --r:10px;
}
*{box-sizing:border-box}
html{background:#070c1a}
body{margin:0;min-height:100vh}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 600px at 20% -10%,rgba(56,189,248,.10),transparent 60%),
    radial-gradient(900px 500px at 100% 0%,rgba(139,92,246,.10),transparent 60%),
    var(--bg);
  font-size:15px; line-height:1.45;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
  padding:10px 20px;background:rgba(7,12,26,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.back-btn{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel);font-size:20px}
.back-btn:hover{background:var(--raise)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-icon{font-size:26px}
.brand-title{font-weight:800;letter-spacing:.6px;font-size:16px}
.brand-sub{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:8px;white-space:nowrap;min-height:44px;
  padding:8px 14px;border-radius:var(--r);border:1px solid transparent;background:transparent;
  color:var(--muted);font-weight:700;font-size:14px;
}
.tab:hover{background:var(--panel);color:var(--text)}
.tab.active{background:var(--accent-soft);border-color:rgba(56,189,248,.45);color:#e0f5ff}
.tab .tab-ico{font-size:18px}
.star-chip{
  min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid rgba(251,191,36,.45);
  background:var(--gold-soft);color:#fde68a;font-weight:800;white-space:nowrap
}

/* ---------- layout ---------- */
.app{
  display:grid;grid-template-columns:260px minmax(0,1fr) 380px;gap:16px;
  padding:16px 20px 24px;align-items:start;
}
.col-left,.col-right{display:flex;flex-direction:column;gap:16px;min-width:0}
.col-center{min-width:0;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h3{
  margin:0 0 10px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;justify-content:space-between;gap:8px
}
.panel h3 .sub{font-size:11px;letter-spacing:0;text-transform:none;color:var(--dim);font-weight:600}

/* ---------- bench ---------- */
.bench-wrap{
  position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line2);
  background:#0a1428;box-shadow:0 10px 40px rgba(0,0,0,.35);
}
#bench{display:block;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.bench-title{
  position:absolute;left:12px;top:10px;pointer-events:none;
  font-size:12px;font-weight:800;letter-spacing:.8px;color:rgba(224,245,255,.75);
  background:rgba(7,12,26,.55);border:1px solid var(--line);padding:4px 10px;border-radius:999px
}
.lab-toast{
  position:absolute;left:50%;top:14px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  background:rgba(15,26,49,.95);border:1px solid var(--line2);padding:8px 14px;border-radius:10px;
  font-weight:700;font-size:14px;transition:opacity .25s,transform .25s;max-width:90%;text-align:center
}
.lab-toast.show{opacity:1;transform:translate(-50%,0)}
.lab-toast.good{border-color:rgba(52,211,153,.6);color:#bbf7d0}
.lab-toast.bad{border-color:rgba(248,113,113,.6);color:#fecaca}
.hint-bar{
  font-size:14px;color:var(--muted);padding:10px 14px;border-radius:10px;
  background:var(--bg2);border:1px dashed var(--line2)
}
.hint-bar b{color:var(--text)}
kbd{font-family:inherit;font-size:12px;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);background:var(--panel2)}

/* ---------- toolbox ---------- */
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:58px;padding:8px 10px;
  border-radius:var(--r);border:1px solid var(--line);background:var(--panel2);text-align:left
}
.tool:hover{border-color:var(--line2);background:var(--raise)}
.tool.active{border-color:var(--accent);background:var(--accent-soft)}
.tool .t-ico{font-size:20px;line-height:1}
.tool .t-name{font-size:13px;font-weight:700}
.tool .t-sub{font-size:11px;color:var(--dim)}
.tool-sep{margin:14px 0 8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-weight:800}
.btn{
  min-height:40px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line2);
  background:var(--panel2);font-weight:700;font-size:14px
}
.btn:hover{background:var(--raise)}
.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#03121f}
.btn.primary:hover{background:var(--accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1f1500}
.btn.danger{border-color:rgba(248,113,113,.5);color:#fecaca}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-col{display:flex;flex-direction:column;gap:8px}
.preset{width:100%;text-align:left}

/* ---------- inspector controls ---------- */
.insp-empty{color:var(--dim);font-size:13px}
.insp-title{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:10px}
.insp-title .i-ico{font-size:22px}
.ctl{margin:10px 0}
.ctl-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:4px}
.ctl-top b{color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
select{
  width:100%;min-height:40px;padding:6px 10px;border-radius:var(--r);border:1px solid var(--line2);
  background:var(--panel2)
}
.seg{display:flex;gap:4px;background:var(--bg2);padding:4px;border-radius:var(--r);border:1px solid var(--line)}
.seg button{flex:1;min-height:36px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-weight:700;font-size:13px}
.seg button.on{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;min-height:36px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.readout{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0
}
.readout div{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.readout small{display:block;font-size:11px;color:var(--dim)}
.readout b{font-variant-numeric:tabular-nums;font-size:15px}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}

/* ---------- notebook ---------- */
.nb-actions{display:flex;gap:8px;margin-bottom:10px}
.nb-actions .btn.primary{flex:1}
.nb-table-wrap{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.nb-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.nb-table th,.nb-table td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.nb-table th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:700;font-size:12px}
.nb-table th:first-child,.nb-table td:first-child{text-align:center;color:var(--dim)}
.nb-table td.derived,.nb-table th.derived{color:#bae6fd}
.nb-table th.derived{color:#7dd3fc}
.nb-del{border:0;background:transparent;color:var(--dim);width:28px;height:28px;border-radius:6px}
.nb-del:hover{background:var(--bad-soft);color:var(--bad)}
.nb-empty{padding:18px;text-align:center;color:var(--dim);font-size:13px}
.nb-axes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:12px 0 8px}
.nb-axes label{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.5px}
.nb-axes .full{grid-column:1/-1}
#nbGraph{width:100%;height:220px;display:block;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.nb-result{margin-top:8px;font-size:13px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.nb-result b{color:var(--text);font-variant-numeric:tabular-nums}
.nb-result .concl{margin-top:4px;color:#bbf7d0;font-weight:700}
.nb-result .concl.no{color:#fde68a}

/* ---------- missions ---------- */
.mission{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.mission.done{border-color:rgba(52,211,153,.45);background:var(--ok-soft)}
.m-head{display:flex;align-items:flex-start;gap:10px}
.m-ico{font-size:20px;line-height:1.2}
.m-body{flex:1;min-width:0}
.m-title{font-weight:800;font-size:14px}
.m-desc{font-size:12.5px;color:var(--muted);margin-top:2px}
.m-star{font-weight:800;color:#fde68a;white-space:nowrap;font-size:13px}
.mission.done .m-star{color:var(--ok)}
.m-answer{display:flex;gap:6px;margin-top:8px}
.m-answer input{
  flex:1;min-width:0;min-height:38px;padding:6px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2)
}
.m-answer .unit{align-self:center;color:var(--muted);font-size:13px}
.m-fb{font-size:12.5px;margin-top:6px}
.m-fb.bad{color:#fecaca}
.m-fb.good{color:#bbf7d0}
.guide{margin-top:4px}
.guide summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--accent);min-height:32px;display:flex;align-items:center}
.guide ol{margin:6px 0 0;padding-left:20px;font-size:13px;color:var(--muted)}
.guide li{margin:3px 0}

/* ---------- responsive ---------- */
@media (max-width:1280px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  .col-right{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (max-width:860px){
  .topbar{flex-wrap:wrap;padding:10px 14px;gap:10px}
  .tabs{order:3;width:100%;margin-left:0}
  .star-chip{margin-left:auto}
  .app{grid-template-columns:minmax(0,1fr);padding:12px 12px 24px}
  .col-center{order:-1}
  .col-right{grid-template-columns:minmax(0,1fr)}
  .brand-sub{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* ---------- 3D ---------- */
#bench3d{position:absolute;left:0;top:0;width:100%;display:none;touch-action:none}
body.three #bench3d{display:block}
body.three #bench{position:relative;z-index:1;background:transparent}
body.three .bench-wrap{background:#0b1222}
.view-bar{position:absolute;right:10px;bottom:10px;z-index:3;display:none;gap:6px}
body.three .view-bar{display:flex}
.view-bar button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:rgba(11,19,38,.82);color:var(--text);font-size:17px;font-weight:800;backdrop-filter:blur(6px)}
.view-bar button:hover{background:var(--raise)}
.load3d{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,12,26,.82);color:var(--muted);font-weight:700}
.load3d.show{display:flex}
.load3d .spin{width:42px;height:42px;border-radius:50%;border:4px solid rgba(56,189,248,.2);border-top-color:var(--accent);animation:spin3d 0.9s linear infinite}
@keyframes spin3d{to{transform:rotate(360deg)}}
.mode-btn{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid rgba(56,189,248,.45);background:var(--accent-soft);color:#e0f5ff;font-weight:800;white-space:nowrap}
.mode-btn:hover{background:rgba(56,189,248,.22)}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tool[draggable="true"]{cursor:grab}
.tool .t-count{font-size:10px;color:var(--gold)}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);font-size:12px;font-weight:700}
.chip.on{border-color:rgba(56,189,248,.6);background:var(--accent-soft);color:#e0f5ff}

/* ---------- điện thoại ---------- */
.mnav{display:none}
@media (max-width:860px){
  .topbar{position:relative;gap:8px;padding:8px 12px}
  .brand{flex:1;min-width:0}
  .brand-title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-icon{display:none}
  .star-chip{margin-left:0}
  .tabs{overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  body{padding-bottom:86px}
  .view-bar button{width:44px;height:44px;font-size:18px}
  .mnav{display:flex;position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:40;gap:2px;padding:5px;border-radius:16px;
    background:rgba(7,12,26,.94);border:1px solid var(--line2);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border:0;border-radius:11px;background:transparent;
    color:var(--muted);font-family:inherit;font-size:11px;font-weight:700;line-height:1.2;position:relative;-webkit-tap-highlight-color:transparent}
  .mnav button span{font-size:19px;line-height:1.1}
  .mnav button.on{background:var(--raise);color:var(--text)}
  .mnav button.ping::after{content:"";position:absolute;top:4px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 0 rgba(245,158,11,.7);animation:mping 1.2s ease-out 3}
  .panel{scroll-margin-top:10px}
}
@keyframes mping{to{box-shadow:0 0 0 10px rgba(245,158,11,0)}}
.nb-axes select{width:100%;min-width:0;max-width:100%}
.panel{min-width:0}

</style>
</head>
<body>
<header class="topbar">
  <button class="back-btn" id="backBtn" type="button" aria-label="Quay lại">←</button>
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">⚛️</span>
    <div>
      <div class="brand-title">PHÒNG LAB VẬT LÝ</div>
      <div class="brand-sub">Bàn thí nghiệm tự do · HỌC ĐỂ LÀM GÌ?</div>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <button class="mode-btn" id="modeBtn" type="button" title="Chuyển chế độ 2D / 3D">🧊 3D</button>
  <button class="star-chip" id="starChip" type="button" title="Sao của bạn">⭐ <b id="starCount">0</b></button>
</header>

<div class="app">
  <aside class="col-left">
    <section class="panel" id="toolbox"></section>
    <section class="panel" id="inspector"></section>
  </aside>

  <main class="col-center">
    <div class="bench-wrap" id="benchWrap">
      <canvas id="bench3d" aria-hidden="true"></canvas>
      <canvas id="bench" aria-label="Bàn thí nghiệm"></canvas>
      <div class="view-bar" id="viewBar">
        <button type="button" data-v="home" title="Góc nhìn mặc định">🎯</button>
        <button type="button" data-v="top" title="Nhìn từ trên xuống">⬇️</button>
        <button type="button" data-v="in" title="Phóng to">＋</button>
        <button type="button" data-v="out" title="Thu nhỏ">－</button>
      </div>
      <div class="load3d" id="load3d"><div class="spin"></div><div>Đang dựng phòng thí nghiệm 3D…</div></div>
      <div class="bench-title" id="benchTitle"></div>
      <div class="lab-toast" id="labToast" role="status" aria-live="polite"></div>
    </div>
    <div class="hint-bar" id="hintBar"></div>
  </main>

  <aside class="col-right">
    <section class="panel" id="notebook"></section>
    <section class="panel" id="missions"></section>
  </aside>
</div>

<nav class="mnav" id="mnav" aria-label="Đi tới">
  <button type="button" data-go="benchWrap"><span>🔬</span>Bàn</button>
  <button type="button" data-go="toolbox"><span>🧰</span>Tủ đồ</button>
  <button type="button" data-go="inspector"><span>🔍</span>Thông số</button>
  <button type="button" data-go="notebook"><span>📒</span>Sổ đo</button>
  <button type="button" data-go="missions"><span>🏆</span>Nhiệm vụ</button>
</nav>

<script>
"use strict";
/* =====================================================================
   PHÒNG LAB VẬT LÝ — HỌC ĐỂ LÀM GÌ?
   Bàn thí nghiệm tự do: Điện học · Chất khí · Quang học · Lò xo · Con lắc
   Mỗi bàn: Tủ dụng cụ → Bàn thí nghiệm (canvas) → Sổ thí nghiệm (bảng, đồ thị,
   khớp đường) → Nhiệm vụ khám phá (cộng sao vào tài khoản qua HDLG).
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function fmt(v, d = 3) {
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a !== 0 && (a < 1e-3 || a >= 1e5)) return v.toExponential(2);
  let s = v.toFixed(d);
  if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
  return s === "-0" ? "0" : s;
}
function sig(v, n = 3) {
  if (v == null || !isFinite(v)) return "—";
  if (v === 0) return "0";
  const d = Math.max(0, n - 1 - Math.floor(Math.log10(Math.abs(v))));
  return fmt(v, Math.min(d, 6));
}
function rand(a, b) { return a + Math.random() * (b - a); }

/* ---------------- Bộ nhớ bí mật (giá trị "bí ẩn" giữ nguyên khi tải lại) ---------------- */
const Secrets = (() => {
  const KEY = "hdlg_lab_secrets";
  let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { s = {}; }
  return {
    get(name, make) {
      if (s[name] == null) { s[name] = make(); try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
      return s[name];
    },
    reset(name) { delete s[name]; try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  };
})();

/* ---------------- Sao & nhiệm vụ (đồng bộ tài khoản qua auth.js) ---------------- */
const Reward = (() => {
  const LOCAL = "hdlg_lab_done";
  function best() { try { return JSON.parse(localStorage.getItem("hdlg_best") || "{}") || {}; } catch (e) { return {}; } }
  function local() { try { return JSON.parse(localStorage.getItem(LOCAL) || "{}") || {}; } catch (e) { return {}; } }
  function isDone(id) { return !!(best()["lab_" + id] || local()[id]); }
  function give(id, stars, label) {
    if (isDone(id)) return false;
    const run = () => {
      if (isDone(id)) return;
      const l = local(); l[id] = stars; localStorage.setItem(LOCAL, JSON.stringify(l));
      if (window.HDLG && typeof HDLG.addStars === "function") {
        const b = best(); b["lab_" + id] = stars;
        localStorage.setItem("hdlg_best", JSON.stringify(b));   // auth.js tự đẩy lên Firebase
        HDLG.addStars(stars, label);
      }
      Lab.toast(`🏆 Hoàn thành: ${label} · +${stars} ⭐`, "good");
      Lab.renderMissions();
      updateStars();

/* ---------------- Thống kê & khớp đường ---------------- */
const Fit = {
  linear(xs, ys) {
    const n = xs.length; if (n < 2) return null;
    let sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (let i = 0; i < n; i++) { sx += xs[i]; sy += ys[i]; sxx += xs[i] * xs[i]; sxy += xs[i] * ys[i]; }
    const den = n * sxx - sx * sx; if (Math.abs(den) < 1e-15) return null;
    const a = (n * sxy - sx * sy) / den, b = (sy - a * sx) / n;
    return { a, b, r2: Fit.r2(xs, ys, x => a * x + b), f: x => a * x + b };
  },
  prop(xs, ys) {
    let sxx = 0, sxy = 0;
    for (let i = 0; i < xs.length; i++) { sxx += xs[i] * xs[i]; sxy += xs[i] * ys[i]; }
    if (xs.length < 2 || sxx < 1e-15) return null;
    const a = sxy / sxx;
    return { a, b: 0, r2: Fit.r2(xs, ys, x => a * x), f: x => a * x };
  },
  inverse(xs, ys) {
    if (xs.some(x => Math.abs(x) < 1e-12)) return null;
    const us = xs.map(x => 1 / x), p = Fit.prop(us, ys);
    if (!p) return null;
    return { a: p.a, b: 0, r2: Fit.r2(xs, ys, x => p.a / x), f: x => p.a / x };
  },
  r2(xs, ys, f) {
    const m = ys.reduce((s, v) => s + v, 0) / ys.length;
    let ss = 0, sr = 0;
    for (let i = 0; i < ys.length; i++) { ss += (ys[i] - m) ** 2; sr += (ys[i] - f(xs[i])) ** 2; }
    return ss < 1e-18 ? (sr < 1e-18 ? 1 : 0) : 1 - sr / ss;
  },
  stats(v) {
    const n = v.length; if (!n) return null;
    const m = v.reduce((s, x) => s + x, 0) / n;
    const sd = Math.sqrt(v.reduce((s, x) => s + (x - m) ** 2, 0) / Math.max(1, n - 1));
    return { mean: m, sd, cv: Math.abs(m) > 1e-15 ? Math.abs(sd / m) : Infinity, min: Math.min(...v), max: Math.max(...v) };
  }
};

/* ---------------- Sổ thí nghiệm ---------------- */
class Notebook {
  constructor(station) {
    this.st = station; this.rows = []; this.x = null; this.y = null; this.fit = "linear";
  }
  cols() { return this.st.columns(this.rows); }
  add(row) {
    if (!row) return;
    row._n = (this.rows.length ? this.rows[this.rows.length - 1]._n : 0) + 1;
    this.rows.push(row);
    Lab.toast(`📒 Đã ghi lần đo #${row._n}`);
    this.render(); Lab.checkMissions();
  }
  remove(i) { this.rows.splice(i, 1); this.render(); }
  clear() { this.rows = []; this.render(); }
  setAxes(x, y, fit) { this.x = x; this.y = y; if (fit) { this.fit = fit; this._fitSet = true; } if (Lab.active === this.st) this.render(); }
  val(row, c) { const v = c.get ? c.get(row) : row[c.key]; return typeof v === "number" && isFinite(v) ? v : null; }
  pairs(xKey, yKey) {
    const cols = this.cols(), cx = cols.find(c => c.key === xKey), cy = cols.find(c => c.key === yKey);
    const xs = [], ys = [];
    if (!cx || !cy) return { xs, ys, cx, cy };
    this.rows.forEach(r => { const a = this.val(r, cx), b = this.val(r, cy); if (a != null && b != null) { xs.push(a); ys.push(b); } });
    return { xs, ys, cx, cy };
  }
  render() {
    const box = $("#notebook"); if (!box || Lab.active !== this.st) return;
    const cols = this.cols();
    const def = this.st.defaultAxes ? this.st.defaultAxes(cols) : [];
    if (!cols.find(c => c.key === this.x)) this.x = def[0] || (cols[0] && cols[0].key);
    if (!cols.find(c => c.key === this.y)) this.y = def[1] || (cols[1] && cols[1].key);
    if (def[2] && !this._fitSet) this.fit = def[2];
    const head = cols.map(c => `<th class="${c.derived ? "derived" : ""}" title="${esc(c.title || "")}">${esc(c.label)}</th>`).join("");
    const body = this.rows.map((r, i) => `<tr><td>${r._n}</td>${cols.map(c => `<td class="${c.derived ? "derived" : ""}">${(v => v == null ? "—" : sig(v, c.sig || 4))(this.val(r, c))}</td>`).join("")}<td><button class="nb-del" data-del="${i}" aria-label="Xóa lần đo ${r._n}">✕</button></td></tr>`).join("");
    const opt = sel => cols.map(c => `<option value="${esc(c.key)}" ${c.key === sel ? "selected" : ""}>${esc(c.label)}</option>`).join("");
    box.innerHTML = `
      <h3>📒 Sổ thí nghiệm <span class="sub">${this.rows.length} lần đo</span></h3>
      <div class="nb-actions">
        <button class="btn primary" id="nbRecord" type="button">✍️ Ghi số liệu</button>
        <button class="btn" id="nbCsv" type="button" title="Tải bảng số liệu (.csv)">⬇️ CSV</button>
        <button class="btn danger" id="nbClear" type="button" title="Xóa toàn bộ số liệu">🗑️</button>
      </div>
      <div class="nb-table-wrap">${this.rows.length
        ? `<table class="nb-table"><thead><tr><th>#</th>${head}<th></th></tr></thead><tbody>${body}</tbody></table>`
        : `<div class="nb-empty">Chưa có số liệu. Làm thí nghiệm rồi bấm <b>Ghi số liệu</b> sau mỗi lần thay đổi.</div>`}
      </div>
      <div class="nb-axes">
        <div><label for="nbX">TRỤC HOÀNH (X)</label><select id="nbX">${opt(this.x)}</select></div>
        <div><label for="nbY">TRỤC TUNG (Y)</label><select id="nbY">${opt(this.y)}</select></div>
        <div class="full"><label for="nbFit">KHỚP ĐƯỜNG</label>
          <select id="nbFit">
            <option value="linear" ${this.fit === "linear" ? "selected" : ""}>Đường thẳng  y = a·x + b</option>
            <option value="prop" ${this.fit === "prop" ? "selected" : ""}>Tỉ lệ thuận  y = a·x</option>
            <option value="inverse" ${this.fit === "inverse" ? "selected" : ""}>Tỉ lệ nghịch  y = a / x</option>
            <option value="none" ${this.fit === "none" ? "selected" : ""}>Không khớp — chỉ vẽ điểm</option>
          </select></div>
      </div>
      <canvas id="nbGraph"></canvas>
      <div class="nb-result" id="nbResult"></div>`;
    $("#nbRecord").onclick = () => this.add(this.st.record());
    $("#nbClear").onclick = () => { if (!this.rows.length || confirm("Xóa toàn bộ số liệu của bàn này?")) this.clear(); };
    $("#nbCsv").onclick = () => this.csv();
    $("#nbX").onchange = e => { this.x = e.target.value; this.drawGraph(); };
    $("#nbY").onchange = e => { this.y = e.target.value; this.drawGraph(); };
    $("#nbFit").onchange = e => { this.fit = e.target.value; this._fitSet = true; this.drawGraph(); };
    box.querySelectorAll("[data-del]").forEach(b => b.onclick = () => this.remove(+b.dataset.del));
    const wrap = box.querySelector(".nb-table-wrap"); if (wrap) wrap.scrollTop = wrap.scrollHeight;
    this.drawGraph();
  }
  csv() {
    const cols = this.cols();
    const lines = [["#"].concat(cols.map(c => c.label)).join(",")];
    this.rows.forEach(r => lines.push([r._n].concat(cols.map(c => { const v = this.val(r, c); return v == null ? "" : v; })).join(",")));
    const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `so-thi-nghiem-${this.st.id}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  drawGraph() {
    const cv = $("#nbGraph"); if (!cv) return;
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    const { xs, ys, cx, cy } = this.pairs(this.x, this.y);
    const res = $("#nbResult");
    const L = 48, R = 12, T = 12, B = 34;
    g.font = "11px Segoe UI, system-ui, sans-serif";
    if (xs.length === 0) {
      g.fillStyle = "#6f82a8"; g.textAlign = "center";
      g.fillText("Đồ thị sẽ hiện khi có số liệu", w / 2, h / 2);
      if (res) res.innerHTML = "Ghi ít nhất 3 lần đo để vẽ đồ thị và tìm quy luật.";
      return;
    }
    let x0 = Math.min(0, ...xs), x1 = Math.max(...xs), y0 = Math.min(0, ...ys), y1 = Math.max(...ys);
    if (x1 - x0 < 1e-12) { x1 += 1; } if (y1 - y0 < 1e-12) { y1 += 1; }
    x1 += (x1 - x0) * 0.08; y1 += (y1 - y0) * 0.1;
    if (x0 < 0) x0 -= (x1 - x0) * 0.05; if (y0 < 0) y0 -= (y1 - y0) * 0.05;
    const px = x => L + (x - x0) / (x1 - x0) * (w - L - R);
    const py = y => h - B - (y - y0) / (y1 - y0) * (h - T - B);
    // lưới
    g.strokeStyle = "rgba(148,180,255,.10)"; g.lineWidth = 1; g.fillStyle = "#8ea2c8"; g.textAlign = "right"; g.textBaseline = "middle";
    for (let i = 0; i <= 4; i++) {
      const yv = y0 + (y1 - y0) * i / 4, yy = py(yv);
      g.beginPath(); g.moveTo(L, yy); g.lineTo(w - R, yy); g.stroke(); g.fillText(sig(yv, 3), L - 6, yy);
    }
    g.textAlign = "center"; g.textBaseline = "top";
    for (let i = 0; i <= 4; i++) {
      const xv = x0 + (x1 - x0) * i / 4, xx = px(xv);
      g.beginPath(); g.moveTo(xx, T); g.lineTo(xx, h - B); g.stroke(); g.fillText(sig(xv, 3), xx, h - B + 4);
    }
    g.strokeStyle = "rgba(200,220,255,.45)";
    g.beginPath(); g.moveTo(px(x0), py(0)); g.lineTo(w - R, py(0)); g.moveTo(px(0), T); g.lineTo(px(0), h - B); g.stroke();
    g.fillStyle = "#cfe3ff"; g.font = "bold 11px Segoe UI, system-ui, sans-serif";
    g.textAlign = "right"; g.fillText(cx.label, w - R, h - 14);
    g.textAlign = "left"; g.textBaseline = "top"; g.fillText(cy.label, L + 4, T);
    // đường khớp
    let fit = null;
    if (this.fit !== "none" && xs.length >= 2) fit = Fit[this.fit](xs, ys);
    if (fit) {
      g.strokeStyle = "#fbbf24"; g.lineWidth = 2; g.setLineDash([6, 4]); g.beginPath();
      const N = 80; let started = false;
      for (let i = 0; i <= N; i++) {
        const xv = x0 + (x1 - x0) * i / N; const yv = fit.f(xv);
        if (!isFinite(yv) || yv < y0 - (y1 - y0) || yv > y1 + (y1 - y0)) { started = false; continue; }
        const X = px(xv), Y = clamp(py(yv), T - 4, h - B + 4);
        if (!started) { g.moveTo(X, Y); started = true; } else g.lineTo(X, Y);
      }
      g.stroke(); g.setLineDash([]);
    }
    // điểm
    xs.forEach((x, i) => {
      g.fillStyle = "#38bdf8"; g.strokeStyle = "#e0f5ff"; g.lineWidth = 1.5;
      g.beginPath(); g.arc(px(x), py(ys[i]), 4.5, 0, TAU); g.fill(); g.stroke();
    });
    if (!res) return;
    // kết luận
    const st = Fit.stats(ys);
    let html = `<div>Số điểm: <b>${xs.length}</b> · Trung bình ${esc(cy.label)} = <b>${sig(st.mean, 4)}</b> (dao động ±${sig(st.cv * 100, 2)}%)</div>`;
    if (fit && !(st.cv < 0.015 && xs.length >= 3)) {
      const unit = cy.slopeUnit && cy.slopeUnit[cx.key] ? " " + cy.slopeUnit[cx.key] : "";
      if (this.fit === "linear") html += `<div>y = <b>${sig(fit.a, 4)}</b>·x ${fit.b >= 0 ? "+" : "−"} <b>${sig(Math.abs(fit.b), 3)}</b> · R² = <b>${fit.r2.toFixed(4)}</b></div>`;
      if (this.fit === "prop") html += `<div>y = <b>${sig(fit.a, 4)}</b>${unit}·x · R² = <b>${fit.r2.toFixed(4)}</b></div>`;
      if (this.fit === "inverse") html += `<div>y = <b>${sig(fit.a, 4)}</b> / x · R² = <b>${fit.r2.toFixed(4)}</b></div>`;
    }
    let concl = "", ok = false;
    if (xs.length >= 3) {
      const xr = Fit.stats(xs);
      if (st.cv < 0.015 && xr.cv > 0.05) { concl = `⇒ ${cy.label} gần như KHÔNG ĐỔI ≈ ${sig(st.mean, 4)} khi ${cx.label} thay đổi.`; ok = true; }
      else if (fit && fit.r2 > 0.995) {
        if (this.fit === "prop" || (this.fit === "linear" && Math.abs(fit.b) < 0.03 * Math.max(Math.abs(st.max), Math.abs(st.min))))
          { concl = `⇒ ${cy.label} TỈ LỆ THUẬN với ${cx.label}, hệ số ≈ ${sig(fit.a, 4)}.`; ok = true; }
        else if (this.fit === "inverse") { concl = `⇒ ${cy.label} TỈ LỆ NGHỊCH với ${cx.label}: ${cy.label}·${cx.label} ≈ ${sig(fit.a, 4)}.`; ok = true; }
        else { concl = `⇒ Quan hệ BẬC NHẤT (đường thẳng không qua gốc).`; ok = true; }
      } else if (fit) concl = `Các điểm chưa nằm trên đường đã chọn (R² = ${fit.r2.toFixed(3)}). Thử kiểu khớp khác hoặc đổi trục.`;
    } else concl = "Cần ít nhất 3 điểm để rút ra quy luật.";
    if (concl) html += `<div class="concl ${ok ? "" : "no"}">${esc(concl)}</div>`;
    res.innerHTML = html;
  }
}

const Draw = {
  roundRect(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  },
  label(g, text, x, y, o = {}) {
    g.save(); g.font = `${o.bold === false ? "" : "bold "}${o.size || 12}px Segoe UI, system-ui, sans-serif`;
    const w = g.measureText(text).width + 12, h = (o.size || 12) + 10;
    const ax = o.align === "left" ? x : o.align === "right" ? x - w : x - w / 2;
    g.fillStyle = o.bg || "rgba(7,12,26,.82)"; g.strokeStyle = o.border || "rgba(148,180,255,.35)"; g.lineWidth = 1;
    Draw.roundRect(g, ax, y - h / 2, w, h, 6); g.fill(); g.stroke();
    g.fillStyle = o.color || "#eef3ff"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, ax + w / 2, y + 0.5);
    g.restore(); return w;
  },
  lcd(g, text, x, y, w, color) {
    g.save(); g.fillStyle = "#04140f"; g.strokeStyle = "rgba(52,211,153,.5)"; g.lineWidth = 1.5;
    Draw.roundRect(g, x - w / 2, y - 13, w, 26, 6); g.fill(); g.stroke();
    g.fillStyle = color || "#5eead4"; g.font = "bold 15px Consolas, Menlo, monospace"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(text, x, y + 1); g.restore();
  },
  benchGrid(g, W, H, step, color) {
    g.fillStyle = "#0a1428"; g.fillRect(0, 0, W, H);
    const grd = g.createRadialGradient(W / 2, H * 0.4, 50, W / 2, H / 2, Math.max(W, H));
    grd.addColorStop(0, "rgba(56,189,248,.06)"); grd.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    g.fillStyle = color || "rgba(148,180,255,.16)";
    for (let x = step; x < W; x += step) for (let y = step; y < H; y += step) g.fillRect(x - 1, y - 1, 2, 2);
  }
};

const Optics = (() => {

    water: { name: "Nước", n: 1.333, fill: "rgba(56,189,248,.22)" },
    diamond: { name: "Kim cương", n: 2.417, fill: "rgba(226,232,240,.24)" },

  const fMys = () => Secrets.get("opt_f", () => +rand(8, 22).toFixed(1));

    else if (l < 580) { r = (l - 510) / 70; g = 1; } else if (l < 645) { r = 1; g = (645 - l) / 65; } else r = 1;

  const rot = (x, y, a) => { const c = Math.cos(a), s = Math.sin(a); return { x: x * c - y * s, y: x * s + y * c }; };
  const toW = (e, lx, ly) => { const p = rot(lx, ly, e.ang * DEG); return { x: e.x + p.x, y: e.y + p.y }; };
  const toL = (e, x, y) => rot(x - e.x, y - e.y, -e.ang * DEG);
  const dot = (a, b) => a.x * b.x + a.y * b.y;

  const prismV = e => { const r = e.s / Math.sqrt(3); return [[0, -r], [e.s / 2, r / 2], [-e.s / 2, r / 2]]; };

  const DEF = {
    laser: () => ({ color: "red", aim: 0, phi: 30, dist: 26 }),
    object: () => ({ h: 4 }),
    lens: () => ({ f: 12, mys: false, ap: 14 }),
    mirror: () => ({ len: 16 }),
    semi: () => ({ R: 9, mat: "glass", ang: -90 }),
    block: () => ({ w: 16, hh: 9, mat: "glass" }),
    prism: () => ({ s: 16, mat: "glass" }),
    screen: () => ({ len: 24 }),
    prot: () => ({ R: 14 })
  };
  function make(type, x, y, o = {}) { return Object.assign({ id: uid++, type, x, y, ang: 0 }, DEF[type](), o); }
  const isGlass = e => e.type === "semi" || e.type === "block" || e.type === "prism";
  const label = e => NAMES[e.type] + (els.filter(x => x.type === e.type).length > 1 ? " #" + (els.filter(x => x.type === e.type).indexOf(e) + 1) : "");

  function surfaces() {
    const S = [];
    const seg = (e, l1, l2, role, nl) => S.push({ k: "seg", a: toW(e, l1[0], l1[1]), b: toW(e, l2[0], l2[1]), e, role, n: nl ? rot(nl[0], nl[1], e.ang * DEG) : null });
    els.forEach(e => {
      if (e.type === "lens") seg(e, [0, -e.ap / 2], [0, e.ap / 2], "lens");
      else if (e.type === "mirror") seg(e, [0, -e.len / 2], [0, e.len / 2], "mirror");
      else if (e.type === "screen") seg(e, [0, -e.len / 2], [0, e.len / 2], "screen");
      else if (e.type === "semi") { seg(e, [-e.R, 0], [e.R, 0], "glass", [0, -1]); S.push({ k: "arc", c: { x: e.x, y: e.y }, R: e.R, e, role: "glass" }); }
      else if (e.type === "block") {
        const w = e.w / 2, h = e.hh / 2;

        seg(e, [w, h], [-w, h], "glass", [0, 1]); seg(e, [-w, h], [-w, -h], "glass", [-1, 0]);
      } else if (e.type === "prism") {
        const V = prismV(e);
        for (let i = 0; i < 3; i++) { const a = V[i], b = V[(i + 1) % 3], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, l = Math.hypot(mx, my); seg(e, a, b, "glass", [mx / l, my / l]); }
      }
    });
    return S;
  }
  function hit(o, d, S) {
    let best = null;
    for (const s of S) {
      let t = Infinity, n = null, u = 0;
      if (s.k === "seg") {
        const ex = s.b.x - s.a.x, ey = s.b.y - s.a.y, den = d.x * ey - d.y * ex;

        const ax = s.a.x - o.x, ay = s.a.y - o.y, tt = (ax * ey - ay * ex) / den;
        u = (ax * d.y - ay * d.x) / den;
        if (tt > 1e-4 && u >= 0 && u <= 1) { t = tt; n = s.n; }
      } else {
        const fx = o.x - s.c.x, fy = o.y - s.c.y, b = fx * d.x + fy * d.y, c = fx * fx + fy * fy - s.R * s.R, disc = b * b - c;
        if (disc < 0) continue;
        const sq = Math.sqrt(disc);
        for (const tt of [-b - sq, -b + sq]) {
          if (tt <= 1e-4) continue;
          const px = o.x + d.x * tt, py = o.y + d.y * tt;
          if (toL(s.e, px, py).y >= -1e-6) { t = tt; n = { x: (px - s.c.x) / s.R, y: (py - s.c.y) / s.R }; break; }
        }
      }
      if (t < (best ? best.t : Infinity)) best = { t, s, n, u };
    }
    return best;
  }
  function traceRay(o, d, lam, I, src, depth, main, out, S) {
    for (let step = 0; step < 32; step++) {
      const h = hit(o, d, S);
      const end = h ? { x: o.x + d.x * h.t, y: o.y + d.y * h.t } : { x: o.x + d.x * 500, y: o.y + d.y * 500 };
      out.segs.push({ a: o, b: end, lam, I, obj: src.type === "object" });
      if (!h || I < 0.01) return;
      const e = h.s.e, role = h.s.role;
      if (role === "screen") { out.hits.push({ e, p: end, lam, I, src }); return; }
      if (role === "mirror") {
        let N = rot(1, 0, e.ang * DEG), ci = -dot(d, N); if (ci < 0) { N = { x: -N.x, y: -N.y }; ci = -ci; }
        const nd = { x: d.x + 2 * ci * N.x, y: d.y + 2 * ci * N.y };
        if (main) out.ev.push({ type: "refl", i: Math.acos(clamp(ci, -1, 1)) / DEG, r: Math.acos(clamp(ci, -1, 1)) / DEG, n1: 1, n2: 1, e, p: end, N, d0: d, d1: nd, src });
        d = nd; o = end; I *= 0.92; continue;
      }
      if (role === "lens") {
        const a = rot(1, 0, e.ang * DEG), u = rot(0, 1, e.ang * DEG), hh = dot({ x: end.x - e.x, y: end.y - e.y }, u);
        const da = dot(d, a), du = dot(d, u);

        guide: ["Thả xi-lanh vào bể ổn nhiệt, gắn áp kế + nhiệt kế.", "Bấm vào bể, đổi nhiệt độ, chờ ✅ Ổn định rồi ghi.", "Đồ thị X = T, Y = V, khớp “Tỉ lệ thuận”."],
        auto(rows) { const r = lastCyl(rows); if (r.length < 5) return false; const p = Fit.stats(colVals(r, "p"));
          return (p.max - p.min) <= 0.01 * p.mean && spread(colVals(r, "n")) < 1e-6 && spread(colVals(r, "T")) >= 50 && Fit.stats(r.map(x => x.V / x.T)).cv <= 0.02; } },
      { id: "gas_gay", icon: "🔒", stars: 5, title: "Chứng minh định luật Gay-Lussac",
        desc: "Khóa pít-tông (V không đổi), đổi nhiệt độ bể (chênh ≥ 50 K), ghi ≥ 5 lần đo: tỉ số p/T phải không đổi.",
        auto(rows) { const r = lastCyl(rows); if (r.length < 5) return false; const v = Fit.stats(colVals(r, "V"));
          return (v.max - v.min) <= 0.005 * v.mean && spread(colVals(r, "n")) < 1e-6 && spread(colVals(r, "T")) >= 50 && Fit.stats(r.map(x => x.p / x.T)).cv <= 0.02; } },
      { id: "gas_clapeyron", icon: "🧮", stars: 10, title: "Phương trình Clapeyron: tìm hằng số R",
        desc: "Đo với ít nhất 2 lượng khí n khác nhau (bơm / xả khí, hoặc dùng 2 xi-lanh), rồi tính R = pV / (nT). Nhập R (sai số ≤ 2%).",
        answer: { unit: "J/(mol·K)", placeholder: "R = ?", check: v => {
          const ns = new Set(Gas3.nb.rows.map(r => r.n)); if (ns.size < 2) return "Hãy ghi số liệu với ít nhất 2 lượng khí n khác nhau trước đã.";
          return Math.abs(v - R) / R <= 0.02; } } },
      { id: "gas_adiabatic", icon: "🧊", stars: 5, title: "Bí ẩn đoạn nhiệt",
        desc: "Bọc vỏ cách nhiệt quanh xi-lanh rồi nén khí thật nhanh: khí nóng lên hơn môi trường ≥ 40 K dù không ai đun! Vì sao vậy?" }
    ]
  };
  station.three = {
    title: "BÀN CHẤT KHÍ 3D (SANDBOX)", hint: HINT3,
    get view() { return view(); },
    _dbg: () => ({ ents, drag, sel, bathT }),
    get top() { return Object.assign(view(), { pitch: 1.4, ty: 0 }); },
    build(l3) {
      L = l3; T = L.T; M = L.mats;
      scene = station.scene = new T.Scene();
      L.room(scene, { size: 240, title: "BÀN CHẤT KHÍ", lines: ["pV = nRT", "R ≈ 8,31 J/(mol·K)"], shadow: 110 });
      L.table(scene, 200, 80, { color: "#2b3343" });
      // bể ổn nhiệt
      const B = new T.Group(); B.position.set(BATH.x, 0, BATH.z); scene.add(B);
      B.add(L.box(BATH.w + 2, 1.2, BATH.d + 2, L.plastic(0x334155, 0.5), 0, 0.6, 0));
      const wall = L.mesh(new T.BoxGeometry(BATH.w, BATH.h, BATH.d), L.mats.glass, 0, BATH.h / 2 + 1.2, 0, { cast: false }); wall.renderOrder = 3; B.add(wall);
      bathLiq = L.mesh(new T.BoxGeometry(BATH.w - 0.6, BATH.liq, BATH.d - 0.6), L.own(new T.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35, roughness: 0.1, depthWrite: false })), 0, BATH.liq / 2 + 1.25, 0, { cast: false }); bathLiq.renderOrder = 2; B.add(bathLiq);
      const coil = new T.Mesh(new T.TorusGeometry(BATH.w * 0.36, 0.4, 8, 48), L.mats.copper); coil.rotation.x = Math.PI / 2; coil.position.y = 2.2; B.add(coil);
      B.add(L.box(14, 9, 6, L.plastic(0x1e293b, 0.45), 0, 6, BATH.d / 2 + 4));
      bathLcd = L.canvasTex(320, 96, () => { });
      const lcd = new T.Mesh(new T.PlaneGeometry(11, 3.3), new T.MeshBasicMaterial({ map: bathLcd })); lcd.position.set(0, 7.4, BATH.d / 2 + 7.02); B.add(lcd);
      B.add(rot(L.cyl(1.2, 1, L.plastic(0xef4444, 0.4), -4, 3.6, BATH.d / 2 + 7.3, { seg: 16 }), "x", Math.PI / 2));
      B.add(rot(L.cyl(1.2, 1, L.plastic(0x3b82f6, 0.4), 4, 3.6, BATH.d / 2 + 7.3, { seg: 16 }), "x", Math.PI / 2));
      bathPick = new T.Mesh(new T.BoxGeometry(BATH.w + 2, BATH.h + 2, BATH.d + 16), new T.MeshBasicMaterial({ visible: false })); bathPick.position.set(BATH.x, BATH.h / 2, BATH.z + 6); bathPick.userData.pick = true; scene.add(bathPick);
      const lt = L.canvasTex(512, 80, (q, w, h) => { q.fillStyle = "#0f172a"; q.fillRect(0, 0, w, h); q.fillStyle = "#e2e8f0"; q.font = "bold 40px Segoe UI, system-ui, sans-serif"; q.textAlign = "center"; q.textBaseline = "middle"; q.fillText("BỂ ỔN NHIỆT", w / 2, h / 2 + 2); });
      const lb = new T.Mesh(new T.PlaneGeometry(14, 2.2), new T.MeshBasicMaterial({ map: lt })); lb.position.set(0, 11.6, BATH.d / 2 + 7.02); B.add(lb);
      root = new T.Group(); scene.add(root);
      marker = new T.Mesh(new T.ConeGeometry(1.2, 2.6, 16), M.sel); marker.rotation.x = Math.PI; marker.visible = false; scene.add(marker);
      hot = new T.Mesh(new T.TorusGeometry(CR + 2.6, 0.3, 8, 40), M.hot); hot.rotation.x = Math.PI / 2; hot.visible = false; scene.add(hot);
    },
    sync(l3, dt) {
      syncScene(dt);
      const car = drag && drag.mode === "carry" && drag.started;
      hot.visible = !!(car && drag.target); if (hot.visible) { const g = gOf.get(drag.target.id); hot.position.set(g.position.x, g.position.y + 1, g.position.z); }
      const s = sel && sel.kind && ents.includes(sel) ? sel : null, g = s && gOf.get(s.id);
      marker.visible = !!g && !car; if (marker.visible) { const b = new T.Box3().setFromObject(g); marker.position.set((b.min.x + b.max.x) / 2, b.max.y + 3 + Math.sin(performance.now() / 250) * 0.6, (b.min.z + b.max.z) / 2); }
    },
    hud(g, l3, W, H) {
      cyls().forEach(c => {
        const gg = gOf.get(c.id); if (!gg) return;
        const p = l3.P(gg.position.x, gg.position.y + BASE + TUBE + 4, gg.position.z); if (!p.vis) return;
        const parts = ["V = " + fmt(c.V, 2).replace(".", ",") + " L"];
        if (attOf(c, "gauge")) parts.push("p = " + fmt(c.p, 0) + " kPa");
        if (attOf(c, "thermo")) parts.push("t = " + fmt(c.T - 273.15, 0) + " °C");
        Draw.label(g, "#" + c.id + "  " + parts.join(" · "), p.x, p.y, { size: 11, color: c.burst > 0 ? "#fca5a5" : sel && cylOfSel() === c ? "#7dd3fc" : "#e2e8f0" });
      });
      const pb = l3.P(BATH.x, BATH.h + 5, BATH.z); if (pb.vis) Draw.label(g, "🛁 " + fmt(bathT - 273.15, 0) + " °C", pb.x, pb.y, { size: 11, color: "#fca5a5" });
      if (drag && drag.mode === "carry" && drag.started && drag.target) { const gg = gOf.get(drag.target.id), p = l3.P(gg.position.x, gg.position.y + BASE + TUBE + 9, gg.position.z); Draw.label(g, "Thả để gắn vào xi-lanh #" + drag.target.id, p.x, p.y, { size: 11, color: "#fde68a" }); }
      if (!ents.length) Draw.label(g, "Bàn trống — lấy dụng cụ ở tủ bên trái hoặc chọn thí nghiệm gợi ý", W / 2, H / 2, { size: 14 });
    },
    down, move, up,
    click(ev) { const h = ev.pick([bathPick]); sel = h ? { kind: "bath" } : null; Lab.renderInspector(); },
    key(ev) { if ((ev.key === "Delete" || ev.key === "Backspace") && sel && sel.id) { ev.preventDefault(); removeEnt(sel); } },
    drop(key, ev) {
      if (!key.startsWith("gas3:")) return; key = key.slice(5); if (!ITEMS[key]) return;
      const q = ev.onY(0); if (!q) return;
      const e = spawn(key, { x: clamp(q.x, -95, 95), z: clamp(q.z, -32, 32) }); if (!e) return;
      if (e.kind !== "cyl") { const c = nearCyl(q); if (c) attach(e, c); }
      Lab.renderInspector();
    }
  };
  return station;
})();
Lab.register(Gas3);

document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", () => Lab.init()) : Lab.init();

</script>
