<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Giao hàng đúng giờ - HỌC ĐỂ LÀM GÌ?</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b1424;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#fff;user-select:none;touch-action:none}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;border-radius:14px}
canvas{position:absolute;inset:0;width:960px;height:540px}
.hud{position:absolute;display:flex;gap:8px;align-items:center}
.pill{background:rgba(10,25,50,.72);border:2px solid rgba(255,255,255,.35);border-radius:16px;padding:6px 12px;font-weight:800;font-size:14px;backdrop-filter:blur(4px)}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.btn{background:linear-gradient(#ffd166,#f4a300);color:#4a2c00;font-weight:900;border-radius:14px;padding:10px 18px;box-shadow:0 4px 0 #b06e00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b06e00}
.btn.g{background:linear-gradient(#6ee7a0,#22b866);color:#053;box-shadow:0 4px 0 #14804a}
.btn.s{padding:7px 12px;font-size:13px}.go{position:absolute;right:22px;bottom:22px;font-size:26px;padding:18px 34px;border-radius:20px;display:none;z-index:5}.go.ready{animation:pl .8s infinite}@keyframes pl{50%{transform:scale(1.08);box-shadow:0 4px 0 #14804a,0 0 26px #7dffa6}}
.btn.sel{outline:3px solid #fff}
#dlg{position:absolute;left:30px;right:30px;bottom:14px;background:rgba(8,20,42,.92);border:3px solid #ffd166;border-radius:18px;padding:16px 22px;min-height:96px;display:none;cursor:pointer}
#nm{position:absolute;top:-17px;left:22px;background:#ffd166;color:#4a2c00;font-weight:900;padding:2px 16px;border-radius:12px}
#tx{font-size:18px;line-height:1.5}
#nx{position:absolute;right:16px;bottom:6px;font-size:12px;opacity:.7;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.1}}
#pop{position:absolute;inset:0;background:rgba(5,12,28,.82);display:none;align-items:center;justify-content:center}
#pop .card{background:#fff7e0;color:#3a2a10;border-radius:20px;padding:24px 30px;max-width:640px;border:5px solid #c98a2b;box-shadow:0 10px 40px #000a}
#pop h2{color:#a8590a;margin-bottom:8px}#pop p{line-height:1.55;margin:6px 0}
.tag{display:inline-block;background:#ffd166;border-radius:20px;padding:3px 12px;font-weight:800;font-size:13px;margin:3px 3px 0 0}
</style>
</head><body>
<div id="stage"><canvas id="cv" width="960" height="540"></canvas>
<div class="hud" style="left:14px;top:12px"><div class="pill" id="hAct"></div><div class="pill">⭐ <span id="hSc">0</span></div></div>
<div class="hud" style="left:14px;top:58px"><button class="btn s" id="bExit">← Thoát</button><button class="btn s" id="bSnd">🔊</button></div><div class="hud" style="left:50%;top:12px;transform:translateX(-50%)"><div class="pill" id="meter"></div></div>
<div class="hud" style="right:14px;top:12px"><button class="btn s" id="bNote">📓 Sổ tay</button></div><button class="btn g go" id="bGo">🚚 XUẤT PHÁT!</button>
<div id="dlg"><div id="nm"></div><div id="tx"></div><div id="nx">chạm để tiếp ▶</div></div>
<div id="pop"></div></div>
<script>
/* GAME: TỐC ĐỘ CHUYỂN ĐỘNG (phần dùng chung lấy từ simulation.html) */
const API=window.HOC_API_BASE||'http://127.0.0.1:8000/api',Q=new URLSearchParams(location.search),LESSON_ID=Q.get('lesson_id'),USER_ID=Number(localStorage.getItem('user_id'))||1;
const $=i=>document.getElementById(i),fmt=(n,d=1)=>Number(n).toLocaleString('vi-VN',{maximumFractionDigits:d});

const cv=$('cv'),c=cv.getContext('2d'),stage=$('stage');
let story,st,score=0,sid=null,topic,P=[],T=0,dlgQ=[],dlgCB=null,typed=0,full='';
const rr=(x,y,w,h,r)=>{c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)};
async function api(p,o){const r=await fetch(API+p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw 0;return r.json()}
async function ev(a,d){if(!sid)return;try{await api(`/games/sessions/${sid}/events`,{method:'POST',body:JSON.stringify({action:a,event_data:JSON.stringify(d||{})})})}catch(e){}}
/* ===== ÂM THANH: tạo bằng WebAudio, không cần file mp3. Chỉnh âm lượng ở các số v / MUSIC_VOL ===== */
let AC,MG,lastAl=0,mute=localStorage.getItem('hdlg_mute')=='1';const MUSIC_VOL=.03;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=mute?0:1;MG.connect(AC.destination);ambient()}if(AC.state=='suspended')AC.resume();return AC}
function tone(f,d=.15,t='sine',v=.07,at=0,fe=0){const a=ac(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+at;o.type=t;o.frequency.setValueAtTime(f,s);if(fe)o.frequency.exponentialRampToValueAtTime(fe,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(MG);o.start(s);o.stop(s+d)}
function noise(d=.3,f=1200,v=.1,ty='lowpass'){const a=ac(),n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;s.buffer=b;fl.type=ty;fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(MG);s.start(t)}
function ambient(){const a=AC,n=a.sampleRate*3,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;x[i]=l*3.5}
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),o=a.createOscillator(),lg=a.createGain();s.buffer=b;s.loop=true;f.type='lowpass';f.frequency.value=600;g.gain.value=.55;o.frequency.value=.15;lg.gain.value=.3;o.connect(lg);lg.connect(g.gain);s.connect(f);f.connect(g);g.connect(MG);s.start();o.start();
 const sc=[523,587,659,784,880,784,659,587];let k=0;setInterval(()=>{if(mute)return;k=Math.max(0,Math.min(7,k+(Math.random()<.5?-1:1)));if(Math.random()<.7)tone(sc[k],1.1,'sine',MUSIC_VOL);if(Math.random()<.25)tone(sc[k]/2,1.6,'triangle',MUSIC_VOL*.8)},650);
 setInterval(()=>{if(!mute&&st&&st.a&&st.a.env=='sea'&&Math.random()<.5){tone(1500,.18,'sine',.03,0,1000);tone(1450,.22,'sine',.03,.22,900)}},6000)}
const SND={pick:()=>tone(430,.08,'triangle',.06),thud:()=>{tone(130,.14,'sine',.12,0,55);noise(.12,500,.1)},splash:()=>noise(.35,1800,.12,'bandpass'),
 talk:w=>tone(w=='tu'?140+Math.random()*30:w=='na'?330+Math.random()*50:240,.05,'triangle',.05),horn:()=>{tone(196,.8,'sawtooth',.07);tone(247,.8,'sawtooth',.05)},
 sink:()=>{noise(1.3,450,.14);tone(320,1.2,'sine',.08,0,60);splash(0,0,0)},alarm:()=>tone(880,.12,'square',.035),fail:()=>tone(230,.45,'sawtooth',.06,0,110),
 note:()=>{tone(880,.1,'sine',.06);tone(1175,.16,'sine',.06,.1)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i==3?.5:.16,'triangle',.08,i*.13))};
addEventListener('pointerdown',()=>ac(),{once:true});addEventListener('keydown',()=>ac(),{once:true});
function fit(){const s=Math.min(innerWidth/960,innerHeight/540);stage.style.transform=`translate(${(innerWidth-960*s)/2}px,${(innerHeight-540*s)/2}px) scale(${s})`;stage._s=s}
addEventListener('resize',fit);fit();


/* ---- hội thoại kiểu visual novel ---- */
function say(lines,cb){dlgQ=lines.slice();dlgCB=cb;$('dlg').style.display='block';st.mode='talk';next()}
function next(){if(typed<full.length){typed=full.length;return show()}const l=dlgQ.shift();if(!l){$('dlg').style.display='none';const f=dlgCB;dlgCB=null;f&&f();return}st.who=l[0];$('nm').textContent=WHO[l[0]];full=l[1];typed=0}
const show=()=>$('tx').textContent=full.slice(0,Math.floor(typed));
$('dlg').onclick=next;addEventListener('keydown',e=>{if(e.key==' '||e.key=='Enter')next()});


function exitGame(){history.length>1?history.back():location.href='../index.html'}
function askExit(){if(st.mode=='end')return exitGame();$('pop').style.display='flex';$('pop').innerHTML=`<div class="card"><h2>Thoát khỏi game?</h2><p>Tiến trình của chặng hiện tại sẽ không được lưu.</p><p style="margin-top:12px"><button class="btn g" onclick="$('pop').style.display='none'">▶ Chơi tiếp</button> <button class="btn" onclick="ev('exit',{act:st.i,score});exitGame()">Thoát</button></p></div>`}
$('bExit').onclick=askExit;$('bSnd').textContent=mute?'🔇':'🔊';$('bSnd').onclick=()=>{mute=!mute;localStorage.setItem('hdlg_mute',mute?'1':'0');$('bSnd').textContent=mute?'🔇':'🔊';if(MG)MG.gain.value=mute?0:1;ac()};addEventListener('keydown',e=>{if(e.key=='Escape')askExit()});
function finish(){st.mode='end';SND.win();const r=story.reveal;if(sid)api(`/games/sessions/${sid}/finish?score=${score}`,{method:'POST'}).catch(()=>{});
 $('pop').style.display='flex';$('pop').innerHTML=`<div class="card"><h2>🏁 Hoàn thành! ${score}/${story.acts.length*100} điểm</h2><h2 style="margin-top:10px">🎓 HỌC ĐỂ LÀM GÌ?</h2><p>${r.text}</p><p><b>Công thức bạn vừa dùng:</b> ${r.formula}</p><p><b>Nghề dùng kiến thức này mỗi ngày:</b></p>${r.jobs.map(j=>`<span class="tag">${j}</span>`).join('')}<p style="margin-top:14px"><button class="btn" onclick="location.reload()">Chơi lại</button> <button class="btn g" onclick="history.length>1?history.back():location.href='../index.html'">Về bài học</button></p></div>`}


/* ---- hạt: bọt nước, pháo giấy ---- */
function splash(x,y,n,col='rgba(255,255,255,.85)',up=3){for(let i=0;i<n;i++)P.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*up-1,l:40+Math.random()*20,col,r:2+Math.random()*3})}
function confetti(){for(let i=0;i<60;i++)P.push({x:480+(Math.random()-.5)*300,y:60,vx:(Math.random()-.5)*5,vy:Math.random()*2,l:120,col:`hsl(${Math.random()*360},90%,60%)`,r:4,g:.08})}


function openInput(){const a=st.a;st.mode='input';$('pop').style.display='flex';$('pop').innerHTML=`<div class="card"><h2>${a.title}</h2><p>${a.prompt}</p>${a.fields.map((f,k)=>`<p>${f.label} <input id="f${k}" type="number" step="any" style="width:100px;font-size:18px;padding:4px"> ${f.unit}</p>`).join('')}<p id="fe" style="color:#a33;font-weight:700"></p><p><button class="btn" onclick="checkInput()">✔ Xác nhận</button> <button class="btn s" onclick="hintInput()">📓 Gợi ý</button></p></div>`}
function hintInput(){if(!st.noted){st.noted=1;st.hints++}ev('hint',{act:st.i});SND.note();$('fe').innerHTML=st.a.note}
function checkInput(){const bad=st.a.fields.filter((f,k)=>!(Math.abs(parseFloat($('f'+k).value)-f.ans)<=f.tol));$('pop').style.display='none';
 if(!bad.length){SND.win();confetti();const a=st.a,g=Math.max(30,100-st.tries*15-st.hints*10);score+=g;$('hSc').textContent=score;ev('success',{act:st.i,tries:st.tries});say([...a.win,['me',`+${g} điểm`]],()=>st.i+1<story.acts.length?newAct(st.i+1):finish());return}
 st.tries++;SND.fail();ev('wrong_answer',{act:st.i,tries:st.tries});say([['nam',bad.map(f=>f.hint).join(' ')]],()=>{st.mode='play';openInput()})}
/* ---- vẽ cảnh ---- */
function person(x,y,o,talk,hot){c.save();c.translate(x,y+Math.sin(T*2+o.ph)*(hot?3:1.5));const s=o.s*(hot?1.06:1);c.scale(s,s);c.globalAlpha=hot||!st.who?1:.78;
 c.fillStyle='#2f4a6b';c.fillRect(-13,-40,10,40);c.fillRect(3,-40,10,40);c.fillStyle=o.shirt;rr(-18,-94,36,58,9);c.fill();
 c.fillStyle=o.skin;c.beginPath();c.arc(0,-110,18,0,7);c.fill();c.fillRect(-26,-88,8,26);c.fillRect(18,-88,8,26);
 c.fillStyle='#2b1d10';c.beginPath();c.arc(-6,-112,2.4,0,7);c.arc(6,-112,2.4,0,7);c.fill();
 c.strokeStyle='#7a3b2a';c.lineWidth=2;c.beginPath();talk?c.ellipse(0,-102,4,2+Math.abs(Math.sin(T*14))*3,0,0,7):(c.moveTo(-5,-102),c.quadraticCurveTo(0,-98,5,-102));c.stroke();
 if(o.hat){c.fillStyle='#e8d28a';c.beginPath();c.moveTo(-36,-118);c.lineTo(36,-118);c.lineTo(0,-158);c.closePath();c.fill();c.strokeStyle='#b99a4a';c.stroke()}
 else{c.fillStyle='#2b1d10';c.beginPath();c.arc(0,-116,19,Math.PI,0);c.fill();c.beginPath();c.arc(-22,-100,7,0,7);c.arc(22,-100,7,0,7);c.fill()}c.restore()}


const WHO={hoa:'Cô Hoa · chủ tiệm bánh',nam:'Nam · điều phối viên',me:'Bạn · tài xế giao hàng'};
SND.cam=()=>{noise(.15,4000,.2,'highpass');tone(1800,.12,'square',.06)};SND.beep=()=>tone(760,.07,'square',.04);
function ambient(){const sc=[392,440,523,587,659,587,523,440];let k=0;setInterval(()=>{if(mute)return;k=(k+1)%8;if(Math.random()<.8)tone(sc[k],.5,'triangle',MUSIC_VOL*1.2);if(k%4==0)tone(sc[k]/2,1.2,'sine',MUSIC_VOL)},420);setInterval(()=>{if(!mute&&st&&st.mode=='drive'&&Math.random()<.3){tone(330,.25,'square',.02);tone(262,.25,'square',.02,.02)}},4000)}
/* =========================================================
   CỐT TRUYỆN + SỐ LIỆU (sửa tại đây): s = quãng đường (km), l = giới hạn tốc độ (km/h), T = hạn giao (phút)
   Mỗi chặng có 2 đoạn đường: s1/l1 rồi s2/l2. 1 giây thật = 2 phút trong game.
========================================================= */
const TS=2;
const STORY={reveal:{formula:'v = s / t   |   t = s / v   |   s = v · t   |   1 m/s = 3,6 km/h',jobs:['Điều phối giao hàng / logistics','Tài xế công nghệ','Kỹ sư quy hoạch giao thông'],text:'Ứng dụng giao hàng và bản đồ ước tính giờ đến bằng chính công thức này. Biết tính, bạn tự chủ động hẹn giờ và lên lịch di chuyển thay vì đoán mò, đồng thời hiểu vì sao giới hạn tốc độ tồn tại.'},acts:[
{name:'Phố và quốc lộ',s1:10,l1:40,s2:20,l2:60,T:40,intro:[['me','Một chiếc bánh kem sinh nhật cần giao gấp. Bạn nhận chiếc xe tải nhỏ và lên đường.'],['hoa','Chú tài xế ơi, bánh phải tới nhà khách trong 40 phút nha, trễ là khách huỷ đơn đó!'],['nam','Lộ trình 30 km: 10 km đầu khu dân cư giới hạn 40 km/h, 20 km sau quốc lộ giới hạn 60 km/h. Có camera bắn tốc độ nghen!'],['nam','Bấm nút + và − (hoặc phím mũi tên) để tăng giảm ga. Nhớ t = s / v để tính giờ!']],win:[['hoa','Bánh tới đúng giờ, khách khen quá trời!']]},
{name:'Đơn gấp',s1:12,l1:40,s2:18,l2:60,T:39,intro:[['nam','Đơn tiếp theo gấp hơn: vẫn 30 km nhưng chỉ có 39 phút. 12 km đầu giới hạn 40 km/h, 18 km sau giới hạn 60 km/h.'],['hoa','Chạy sát giới hạn thôi nhưng đừng vượt nha!']],win:[['nam','Chuẩn! Tính trước thời gian từng đoạn nên không phải đoán mò.']]},
{name:'Kẹt xe!',s1:6,l1:20,s2:24,l2:80,T:40,intro:[['nam','Báo động! Tuyến này đang kẹt xe: 6 km đầu chỉ nhích được 20 km/h. Đoạn cao tốc 24 km phía sau giới hạn 80 km/h. Hạn vẫn là 40 phút!'],['hoa','Vậy đoạn cao tốc phải chạy nhanh bù lại. Em tính coi cần chạy bao nhiêu nha!']],win:[['hoa','Giao đúng giờ dù kẹt xe! Em tính giỏi quá.']]},
{name:'Đổi đơn vị',type:'input',s1:10,l1:50,s2:10,l2:50,T:99,goal:'Đổi đơn vị tốc độ cho đúng giữa m/s và km/h',title:'🚦 Biển báo m/s, đồng hồ km/h',prompt:'Tuyến mới ghi tốc độ bằng <b>m/s</b> trên biển báo, còn đồng hồ xe hiện <b>km/h</b>. Đổi giúp tôi (1 m/s = 3,6 km/h):',
 fields:[{label:'Biển cầu giới hạn 15 m/s =',unit:'km/h',ans:54,tol:.5,hint:'15 m/s = 15 × 3,6 = 54 km/h.'},{label:'Đồng hồ xe đang chạy 72 km/h =',unit:'m/s',ans:20,tol:.2,hint:'72 km/h ÷ 3,6 = 20 m/s.'},{label:'Hầm dài 1,8 km, chạy 36 km/h thì vượt hầm mất',unit:'phút',ans:3,tol:.1,hint:'t = s / v = 1,8 / 36 = 0,05 giờ = 3 phút.'}],
 note:'1 m/s = 3,6 km/h. Đổi m/s sang km/h thì nhân 3,6, đổi km/h sang m/s thì chia 3,6. Thời gian t = s / v (nhớ cùng đơn vị).',
 intro:[['nam','Công ty vừa chuyển sang tuyến mới. Biển báo cầu ghi tốc độ bằng m/s, nhưng đồng hồ trên xe hiện km/h. Đổi nhầm là chạy quá tốc độ, camera phạt liền.'],['hoa','Cô muốn chú tính chắc chắn trước khi chạy, đừng đoán nhé!']],win:[['hoa','Chuẩn rồi! Đổi đúng đơn vị thì mới biết mình đang chạy nhanh hay chậm so với biển báo.'],['nam','Cả bốn đơn đều giao xong. Chú là tài xế đáng tin cậy nhất của công ty!']]}]};
story=STORY;
const PEO=[{x:130,ph:0,s:1,shirt:'#e0679b',skin:'#e8b890',hat:0,id:'hoa'},{x:200,ph:2,s:.85,shirt:'#4a8fe0',skin:'#e0ac80',hat:0,id:'nam'}];
const tot=a=>a.s1+a.s2,lim=()=>st.pos<st.a.s1?st.a.l1:st.a.l2;
function newAct(i,re){const a=story.acts[i];st={i,a,pos:0,time:0,v:0,tv:0,flash:0,lastT:0,mode:'talk',tries:st.i===i?st.tries:0,hints:st.i===i?st.hints:0,noted:0,hu:0};
 $('hAct').textContent=`Chặng ${i+1}/${story.acts.length} · ${a.name}`;$('hSc').textContent=score;const go=()=>{st.mode='play';hud();a.type=='input'&&openInput()};if(re)go();else say(a.intro,go)}
function hud(){const a=st.a;if(a.type=='input'){$('meter').textContent=a.goal;return}$('meter').innerHTML=st.mode=='drive'||st.mode=='fine'?`${fmt(st.pos)}/${tot(a)} km · ⏱ <b style="color:${st.time>a.T*.9?'#ff7b7b':'#7dffa6'}">${fmt(st.time)}</b>/${a.T} phút · Giới hạn <b>${lim()}</b>`:`Quãng đường ${tot(a)} km · Hạn giao ${a.T} phút`;$('bGo').classList.toggle('ready',st.mode=='play')}
const BTN=[{x:420,y:482,d:-5,t:'−'},{x:520,y:482,d:5,t:'+'}];
function tweak(d){if(st.mode!='drive')return;st.tv=Math.max(0,Math.min(100,st.tv+d));SND.beep();ev('change_parameter',{tv:st.tv,pos:+st.pos.toFixed(1)})}
cv.onpointerdown=e=>{const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/stage._s,y=(e.clientY-r.top)/stage._s;BTN.forEach(b=>{if(Math.hypot(x-b.x,y-b.y)<38)tweak(b.d)})};
addEventListener('keydown',e=>{if(e.key=='ArrowUp'||e.key=='w')tweak(5);if(e.key=='ArrowDown'||e.key=='s')tweak(-5)});
$('bGo').onclick=()=>{if(st.mode!='play')return;st.mode='drive';st.tv=20;st.lastT=T;$('dlg').style.display='none';SND.horn&&SND.horn()};
function after(){const r=st.res,a=st.a,tries=++st.tries;
 if(r.kind=='win'){SND.win();confetti();const g=Math.max(30,100-(tries-1)*15-st.hints*10);score+=g;$('hSc').textContent=score;ev('success',{act:st.i,tries,time:+r.time.toFixed(1)});say([...a.win,['me',`Về đích sau ${fmt(r.time)} phút (hạn ${a.T}). +${g} điểm`]],()=>st.i+1<story.acts.length?newAct(st.i+1):finish());return}
 SND.fail();ev('wrong_answer',{act:st.i,tries,kind:r.kind});ev('retry',{act:st.i});
 const m=r.kind=='fine'?`Camera bắt xe chạy ${fmt(r.v,0)} km/h, trong khi đoạn này giới hạn ${r.lim} km/h. Bị phạt nặng và rất nguy hiểm!`:`Hết ${a.T} phút mà mới đi được ${fmt(r.pos)}/${tot(a)} km, khách đã huỷ đơn. Tốc độ trung bình cần ít nhất ${fmt(tot(a)/a.T*60)} km/h.`;
 const k=st.tries,hh=st.hints;say([['hoa',m],['nam','Thử lại nha! Dùng t = s / v tính thời gian từng đoạn trước khi chạy.']],()=>{newAct(st.i,1);st.tries=k;st.hints=hh})}
$('bNote').onclick=()=>{if(st.mode!='play')return;const a=st.a,t1=a.s1/a.l1*60,n2=a.s2/(a.T-t1)*60;if(!st.noted){st.noted=1;const t=+localStorage.getItem('hdlg_hints')||0;if(t>0)localStorage.setItem('hdlg_hints',t-1);else st.hints++}ev('hint',{act:st.i});SND.note();
 $('pop').style.display='flex';$('pop').innerHTML=`<div class="card"><h2>📓 Sổ tay tài xế</h2><p>Thời gian = quãng đường ÷ vận tốc: <b>t = s / v</b> (nhớ đổi ra phút: nhân 60).</p><p>Đoạn 1: ${a.s1} km ở ${a.l1} km/h mất tối thiểu <b>${fmt(t1)} phút</b>.</p><p>Còn lại ${fmt(a.T-t1)} phút cho đoạn 2 (${a.s2} km) → cần chạy ít nhất <b>${fmt(n2)} km/h</b>${n2>a.l2?' (vượt giới hạn, hãy chạy nhanh hơn ở đoạn 1!)':`, tối đa cho phép ${a.l2} km/h`}.</p><p style="margin-top:12px"><button class="btn" onclick="$('pop').style.display='none'">Đã hiểu</button></p></div>`};
/* ---- vẽ cảnh ---- */
function sign(x,y,n,pulse){c.fillStyle='#fff';c.beginPath();c.arc(x,y,pulse?34:30,0,7);c.fill();c.strokeStyle='#d62828';c.lineWidth=7;c.stroke();c.fillStyle='#111';c.font='bold 26px Arial';c.textAlign='center';c.fillText(n,x,y+9)}
function draw(){const a=st.a,o=st.pos*260,v=st.v;c.clearRect(0,0,960,540);
 let g=c.createLinearGradient(0,0,0,330);g.addColorStop(0,'#7ec8ff');g.addColorStop(1,'#fff1cf');c.fillStyle=g;c.fillRect(0,0,960,540);
 c.fillStyle='rgba(255,240,170,.9)';c.beginPath();c.arc(800,110,36,0,7);c.fill();
 c.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<4;i++){const x=((i*300-o*.05+T*6)%1300+1300)%1300-150,y=60+i*34;c.beginPath();c.arc(x,y,22,0,7);c.arc(x+26,y+4,28,0,7);c.arc(x+54,y,20,0,7);c.fill()}
 c.fillStyle='#8fbf9a';c.beginPath();c.moveTo(0,330);for(let x=0;x<=960;x+=20)c.lineTo(x,270-Math.sin((x+o*.1)*.012)*30);c.lineTo(960,330);c.fill();
 for(let i=-1;i<12;i++){const bx=((i*110-o*.4)%1320+1320)%1320-110,sd=Math.abs(Math.sin(i*12.9898+Math.floor((o*.4+i*110)/1320)*7))*1e3%1,bh=90+sd*90;c.fillStyle=['#c9a98a','#a9b8c9','#d9b4a0','#b3c9a9'][i%4];c.fillRect(bx,340-bh,90,bh);c.fillStyle='rgba(255,255,255,.55)';for(let wy=350-bh;wy<330;wy+=24)for(let wx=bx+10;wx<bx+80;wx+=22)c.fillRect(wx,wy,10,12)}
 c.fillStyle='#b8b3a8';c.fillRect(0,340,960,24);c.fillStyle='#4d535c';c.fillRect(0,364,960,100);c.fillStyle='#fff';for(let x=-((o)%80);x<960;x+=80)c.fillRect(x,412,44,5);c.fillStyle='#3b4047';c.fillRect(0,464,960,76);
 if(a.l1<=20&&st.pos<a.s1)[560,690,820].forEach((x,k)=>{c.fillStyle=['#e85d75','#4a8fe0','#f0b429'][k];rr(x,384,90,40,8);c.fill();c.fillStyle='#d62';c.fillRect(x,396,6,10);c.fillStyle='#8fd0ff';c.fillRect(x+55,388,26,14)});
 const tx=300,ty=426+Math.sin(T*18)*(v>0?1.5:0);c.fillStyle='#fff';rr(tx-130,ty-92,150,84,8);c.fill();c.strokeStyle='#999';c.lineWidth=3;c.stroke();c.font='38px serif';c.fillStyle='#000';c.textAlign='center';c.fillText('🎂',tx-55,ty-44);c.font='bold 12px Arial';c.fillText('BÁNH KEM',tx-55,ty-20);
 c.fillStyle='#d62828';rr(tx+22,ty-68,74,60,10);c.fill();c.fillStyle='#9fd8ff';c.fillRect(tx+56,ty-60,34,26);c.fillStyle='#444';c.fillRect(tx-130,ty-8,226,10);
 [tx-90,tx+60].forEach(x=>{c.save();c.translate(x,ty+6);c.rotate(st.pos*300);c.fillStyle='#222';c.beginPath();c.arc(0,0,19,0,7);c.fill();c.fillStyle='#bbb';c.fillRect(-3,-15,6,30);c.fillRect(-15,-3,30,6);c.restore()});
 if(v>5&&Math.random()<.4)P.push({x:tx-135,y:ty,vx:-1-v/30,vy:-.3,l:30,col:'rgba(150,150,150,.5)',r:5,g:-.01});
 const l=lim();sign(70,150,l,st.hu>0);if(st.hu>0)st.hu-=.02;
 // thanh lộ trình
 const bx0=190,bw=580,w1=bw*a.s1/tot(a);c.fillStyle=a.l1<=20?'#e05a4a':'#6a8fb5';rr(bx0,64,w1,14,7);c.fill();c.fillStyle='#4a9a6a';rr(bx0+w1,64,bw-w1,14,7);c.fill();c.fillStyle='#fff';c.font='bold 11px Arial';c.textAlign='center';c.fillText(a.s1+' km · ≤'+a.l1,bx0+w1/2,75);c.fillText(a.s2+' km · ≤'+a.l2,bx0+w1+(bw-w1)/2,75);c.font='18px serif';c.fillText('🚚',bx0+bw*Math.min(1,st.pos/tot(a)),62);c.fillText('🏁',bx0+bw+14,78);
 // đồng hồ tốc độ
 const cx=740,cy=500,R=82;c.fillStyle='rgba(10,25,50,.85)';c.beginPath();c.arc(cx,cy,R+10,Math.PI,0);c.lineTo(cx+R+10,540);c.lineTo(cx-R-10,540);c.fill();c.lineWidth=8;c.strokeStyle='#3bb877';c.beginPath();c.arc(cx,cy,R-8,Math.PI,Math.PI+Math.PI*l/100);c.stroke();c.strokeStyle='#e33';c.beginPath();c.arc(cx,cy,R-8,Math.PI+Math.PI*l/100,2*Math.PI);c.stroke();
 const ag=Math.PI+Math.PI*Math.min(v,100)/100;c.strokeStyle='#fff';c.lineWidth=5;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(ag)*(R-14),cy+Math.sin(ag)*(R-14));c.stroke();c.fillStyle='#fff';c.font='bold 22px Arial';c.textAlign='center';c.fillText(Math.round(v)+' km/h',cx,cy-22);c.font='bold 12px Arial';c.fillStyle='#ffd166';c.fillText('Ga mục tiêu: '+st.tv,cx,cy-4);
 BTN.forEach(b=>{c.fillStyle=st.mode=='drive'?(b.d>0?'#22b866':'#e05a4a'):'#666';c.beginPath();c.arc(b.x,b.y,34,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=4;c.stroke();c.fillStyle='#fff';c.font='bold 40px Arial';c.fillText(b.t,b.x,b.y+14)});
 c.font='bold 12px Arial';c.fillStyle='#fff';c.fillText('GIẢM GA',420,534);c.fillText('TĂNG GA',520,534);
 if(st.flash>0){c.fillStyle=`rgba(255,255,255,${st.flash})`;c.fillRect(0,0,960,540);st.flash-=.04}
 if(st.mode=='talk')PEO.forEach(q=>person(q.x,470,q,st.who==q.id&&typed<full.length,st.who==q.id));
 P=P.filter(p=>p.l-->0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||.15;c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill()})}
let hT=0;function loop(t){T=t/1000;$('bGo').style.display=st.mode=='play'?'block':'none';const a=st.a;
 if(typed<full.length){const b4=Math.floor(typed);typed+=.9;if(Math.floor(typed)!=b4&&b4%2==0&&full[b4]!=' ')SND.talk(st.who);show()}
 if(st.mode=='drive'){const dt=Math.min(.05,T-st.lastT),dm=dt*TS;st.lastT=T;st.v+=Math.max(-70*dt,Math.min(70*dt,st.tv-st.v));st.pos+=st.v*dm/60;st.time+=dm;const l=lim();
  if(st.pos>=a.s1&&st.pos-st.v*dm/60<a.s1){st.hu=1;SND.beep()}
  if(st.v>l+1){st.mode='fine';st.fineT=T;st.flash=1;SND.cam();st.res={kind:'fine',v:st.v,lim:l}}
  else if(st.pos>=tot(a)){st.pos=tot(a);st.mode='end';st.res={kind:st.time<=a.T?'win':'late',time:st.time,pos:st.pos};after()}
  else if(st.time>a.T){st.mode='end';st.res={kind:'late',time:st.time,pos:st.pos};after()}
  if(T-hT>.15){hT=T;hud()}}
 else if(st.mode=='fine'){st.v=Math.max(0,st.v-60*.016);if(T-st.fineT>1.6){st.mode='end';after()}}
 draw();requestAnimationFrame(loop)}
