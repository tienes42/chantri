<!DOCTYPE html>

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thử thách Hàm số</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 30px 20px;
    }

    .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
    }

    .back-btn {
        border: none;
        background: white;
        padding: 10px 16px;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .score {
        font-weight: bold;
        font-size: 18px;
    }

    .card {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 5px 20px rgba(0,0,0,.08);
        margin-bottom: 20px;
    }

    h1 {
        margin-top: 0;
    }

    .function-box {
        background: #f1f5f9;
        border-radius: 15px;
        padding: 25px;
        text-align: center;
        margin: 25px 0;
    }

    .function {
        font-size: 32px;
        font-weight: bold;
    }

    .target {
        font-size: 22px;
        margin-top: 15px;
    }

    .options {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
        margin-top: 20px;
    }

    .option {
        padding: 16px;
        border: 2px solid #dbe3ec;
        background: white;
        border-radius: 12px;
        font-size: 18px;
        cursor: pointer;
    }

    .option:hover {
        border-color: #2563eb;
    }

    .option:disabled {
        cursor: not-allowed;
        opacity: .7;
    }

    .message {
        min-height: 30px;
        margin-top: 20px;
        font-weight: bold;
        text-align: center;
    }

    .progress {
        margin-top: 20px;
        color: #64748b;
        text-align: center;
    }

    .finish {
        display: none;
        text-align: center;
    }

    .finish button {
        border: none;
        padding: 13px 25px;
        border-radius: 12px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        font-size: 16px;
    }

    @media (max-width: 650px) {
        .options {
            grid-template-columns: repeat(2, 1fr);
        }

        .function {
            font-size: 25px;
        }
    }
</style>


</head>

<body>

<div class="container">

<div class="top">
    <button class="back-btn" onclick="goBack()">
        ← Quay lại
    </button>

    <div class="score">
        Điểm: <span id="score">0</span>
    </div>
</div>

<div class="card" id="gameCard">

    <h1>🎯 Thử thách Hàm số</h1>

    <p>
        Chọn giá trị <strong>x</strong> sao cho hàm số đạt đúng giá trị
        <strong>y</strong> được yêu cầu.
    </p>

    <div class="function-box">

        <div class="function" id="functionText">
            y = 2x + 3
        </div>

        <div class="target">
            Hãy tìm x khi <strong>y = <span id="targetY">7</span></strong>
        </div>

    </div>

    <div class="options" id="options"></div>

    <div class="message" id="message"></div>

    <div class="progress">
        Câu <span id="questionNumber">1</span>/5
    </div>

</div>

<div class="card finish" id="finishCard">

    <h2>🎉 Hoàn thành!</h2>

    <p>
        Điểm của bạn:
        <strong id="finalScore">0</strong>
    </p>

    <p id="finishMessage"></p>

    <button onclick="location.reload()">
        Chơi lại
    </button>

</div>


</div>

<script src="function-challenge.js"></script>

</body>
</html>
