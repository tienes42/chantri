<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cảng container cảnh báo - HỌC ĐỂ LÀM GÌ?</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b1424;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#fff;user-select:none;touch-action:none}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;border-radius:14px}
canvas{position:absolute;inset:0;width:960px;height:540px}
.hud{position:absolute;display:flex;gap:8px;align-items:center}
.pill{background:rgba(10,25,50,.72);border:2px solid rgba(255,255,255,.35);border-radius:16px;padding:6px 12px;font-weight:800;font-size:14px;backdrop-filter:blur(4px)}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.btn{background:linear-gradient(#ffd166,#f4a300);color:#4a2c00;font-weight:900;border-radius:14px;padding:10px 18px;box-shadow:0 4px 0 #b06e00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b06e00}
.btn.g{background:linear-gradient(#6ee7a0,#22b866);color:#053;box-shadow:0 4px 0 #14804a}
.btn.s{padding:7px 12px;font-size:13px}.go{position:absolute;right:22px;bottom:22px;font-size:26px;padding:18px 34px;border-radius:20px;display:none;z-index:5}.go.ready{animation:pl .8s infinite}@keyframes pl{50%{transform:scale(1.08);box-shadow:0 4px 0 #14804a,0 0 26px #7dffa6}}
.btn.sel{outline:3px solid #fff}
#dlg{position:absolute;left:30px;right:30px;bottom:14px;background:rgba(8,20,42,.92);border:3px solid #ffd166;border-radius:18px;padding:16px 22px;min-height:96px;display:none;cursor:pointer}
#nm{position:absolute;top:-17px;left:22px;background:#ffd166;color:#4a2c00;font-weight:900;padding:2px 16px;border-radius:12px}
#tx{font-size:18px;line-height:1.5}
#nx{position:absolute;right:16px;bottom:6px;font-size:12px;opacity:.7;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.1}}
#pop{position:absolute;inset:0;background:rgba(5,12,28,.82);display:none;align-items:center;justify-content:center}
#pop .card{background:#fff7e0;color:#3a2a10;border-radius:20px;padding:24px 30px;max-width:640px;border:5px solid #c98a2b;box-shadow:0 10px 40px #000a}
#pop h2{color:#a8590a;margin-bottom:8px}#pop p{line-height:1.55;margin:6px 0}
.tag{display:inline-block;background:#ffd166;border-radius:20px;padding:3px 12px;font-weight:800;font-size:13px;margin:3px 3px 0 0}
</style>
</head><body>
<div id="stage"><canvas id="cv" width="960" height="540"></canvas>
<div class="hud" style="left:14px;top:12px"><div class="pill" id="hAct"></div><div class="pill">⭐ <span id="hSc">0</span></div></div>
<div class="hud" style="left:14px;top:58px"><button class="btn s" id="bExit">← Thoát</button><button class="btn s" id="bSnd">🔊</button></div><div class="hud" style="left:50%;top:12px;transform:translateX(-50%)"><div class="pill" id="meter"></div></div>
<div class="hud" style="right:14px;top:12px"><button class="btn s" id="bNote">📓 Sổ tay</button></div><button class="btn g go" id="bGo">✅ XÁC NHẬN</button>
<div id="dlg"><div id="nm"></div><div id="tx"></div><div id="nx">chạm để tiếp ▶</div></div>
<div id="pop"></div></div>
<script>
/* GAME: ÂM THANH (phần dùng chung lấy từ simulation.html) */
const API=window.HOC_API_BASE||'http://127.0.0.1:8000/api',Q=new URLSearchParams(location.search),LESSON_ID=Q.get('lesson_id'),USER_ID=Number(localStorage.getItem('user_id'))||1;
const $=i=>document.getElementById(i),fmt=(n,d=1)=>Number(n).toLocaleString('vi-VN',{maximumFractionDigits:d});

const cv=$('cv'),c=cv.getContext('2d'),stage=$('stage');
let story,st,score=0,sid=null,topic,P=[],T=0,dlgQ=[],dlgCB=null,typed=0,full='';
const rr=(x,y,w,h,r)=>{c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)};
async function api(p,o){const r=await fetch(API+p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw 0;return r.json()}
async function ev(a,d){if(!sid)return;try{await api(`/games/sessions/${sid}/events`,{method:'POST',body:JSON.stringify({action:a,event_data:JSON.stringify(d||{})})})}catch(e){}}
/* ===== ÂM THANH: tạo bằng WebAudio, không cần file mp3. Chỉnh âm lượng ở các số v / MUSIC_VOL ===== */
let AC,MG,lastAl=0,mute=localStorage.getItem('hdlg_mute')=='1';const MUSIC_VOL=.03;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=mute?0:1;MG.connect(AC.destination);ambient()}if(AC.state=='suspended')AC.resume();return AC}
function tone(f,d=.15,t='sine',v=.07,at=0,fe=0){const a=ac(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+at;o.type=t;o.frequency.setValueAtTime(f,s);if(fe)o.frequency.exponentialRampToValueAtTime(fe,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(MG);o.start(s);o.stop(s+d)}
function noise(d=.3,f=1200,v=.1,ty='lowpass'){const a=ac(),n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;s.buffer=b;fl.type=ty;fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(MG);s.start(t)}
function ambient(){const a=AC,n=a.sampleRate*3,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;x[i]=l*3.5}
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),o=a.createOscillator(),lg=a.createGain();s.buffer=b;s.loop=true;f.type='lowpass';f.frequency.value=600;g.gain.value=.55;o.frequency.value=.15;lg.gain.value=.3;o.connect(lg);lg.connect(g.gain);s.connect(f);f.connect(g);g.connect(MG);s.start();o.start();
 const sc=[523,587,659,784,880,784,659,587];let k=0;setInterval(()=>{if(mute)return;k=Math.max(0,Math.min(7,k+(Math.random()<.5?-1:1)));if(Math.random()<.7)tone(sc[k],1.1,'sine',MUSIC_VOL);if(Math.random()<.25)tone(sc[k]/2,1.6,'triangle',MUSIC_VOL*.8)},650);
 setInterval(()=>{if(!mute&&st&&st.a&&st.a.env=='sea'&&Math.random()<.5){tone(1500,.18,'sine',.03,0,1000);tone(1450,.22,'sine',.03,.22,900)}},6000)}
const SND={pick:()=>tone(430,.08,'triangle',.06),thud:()=>{tone(130,.14,'sine',.12,0,55);noise(.12,500,.1)},splash:()=>noise(.35,1800,.12,'bandpass'),
 talk:w=>tone(w=='tu'?140+Math.random()*30:w=='na'?330+Math.random()*50:240,.05,'triangle',.05),horn:()=>{tone(196,.8,'sawtooth',.07);tone(247,.8,'sawtooth',.05)},
 sink:()=>{noise(1.3,450,.14);tone(320,1.2,'sine',.08,0,60);splash(0,0,0)},alarm:()=>tone(880,.12,'square',.035),fail:()=>tone(230,.45,'sawtooth',.06,0,110),
 note:()=>{tone(880,.1,'sine',.06);tone(1175,.16,'sine',.06,.1)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i==3?.5:.16,'triangle',.08,i*.13))};
addEventListener('pointerdown',()=>ac(),{once:true});addEventListener('keydown',()=>ac(),{once:true});
function fit(){const s=Math.min(innerWidth/960,innerHeight/540);stage.style.transform=`translate(${(innerWidth-960*s)/2}px,${(innerHeight-540*s)/2}px) scale(${s})`;stage._s=s}
addEventListener('resize',fit);fit();


/* ---- hội thoại kiểu visual novel ---- */
function say(lines,cb){dlgQ=lines.slice();dlgCB=cb;$('dlg').style.display='block';st.mode='talk';next()}
function next(){if(typed<full.length){typed=full.length;return show()}const l=dlgQ.shift();if(!l){$('dlg').style.display='none';const f=dlgCB;dlgCB=null;f&&f();return}st.who=l[0];$('nm').textContent=WHO[l[0]];full=l[1];typed=0}
const show=()=>$('tx').textContent=full.slice(0,Math.floor(typed));
$('dlg').onclick=next;addEventListener('keydown',e=>{if(e.key==' '||e.key=='Enter')next()});


function exitGame(){history.length>1?history.back():location.href='../index.html'}
function askExit(){if(st.mode=='end')return exitGame();$('pop').style.display='flex';$('pop').innerHTML=`<div class="card"><h2>Thoát khỏi game?</h2><p>Tiến trình của chặng hiện tại sẽ không được lưu.</p><p style="margin-top:12px"><button class="btn g" onclick="$('pop').style.display='none'">▶ Chơi tiếp</button> <button class="btn" onclick="ev('exit',{act:st.i,score});exitGame()">Thoát</button></p></div>`}
$('bExit').onclick=askExit;$('bSnd').textContent=mute?'🔇':'🔊';$('bSnd').onclick=()=>{mute=!mute;localStorage.setItem('hdlg_mute',mute?'1':'0');$('bSnd').textContent=mute?'🔇':'🔊';if(MG)MG.gain.value=mute?0:1;ac()};addEventListener('keydown',e=>{if(e.key=='Escape')askExit()});
function finish(){st.mode='end';SND.win();const r=story.reveal;if(sid)api(`/games/sessions/${sid}/finish?score=${score}`,{method:'POST'}).catch(()=>{});
 $('pop').style.display='flex';$('pop').innerHTML=`<div class="card"><h2>🏁 Hoàn thành! ${score}/${story.acts.length*100} điểm</h2><h2 style="margin-top:10px">🎓 HỌC ĐỂ LÀM GÌ?</h2><p>${r.text}</p><p><b>Công thức bạn vừa dùng:</b> ${r.formula}</p><p><b>Nghề dùng kiến thức này mỗi ngày:</b></p>${r.jobs.map(j=>`<span class="tag">${j}</span>`).join('')}<p style="margin-top:14px"><button class="btn" onclick="location.reload()">Chơi lại</button> <button class="btn g" onclick="history.length>1?history.back():location.href='../index.html'">Về bài học</button></p></div>`}


/* ---- hạt: bọt nước, pháo giấy ---- */
function splash(x,y,n,col='rgba(255,255,255,.85)',up=3){for(let i=0;i<n;i++)P.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*up-1,l:40+Math.random()*20,col,r:2+Math.random()*3})}
function confetti(){for(let i=0;i<60;i++)P.push({x:480+(Math.random()-.5)*300,y:60,vx:(Math.random()-.5)*5,vy:Math.random()*2,l:120,col:`hsl(${Math.random()*360},90%,60%)`,r:4,g:.08})}

/* ---- vẽ cảnh ---- */
function person(x,y,o,talk,hot){c.save();c.translate(x,y+Math.sin(T*2+o.ph)*(hot?3:1.5));const s=o.s*(hot?1.06:1);c.scale(s,s);c.globalAlpha=hot||!st.who?1:.78;
 c.fillStyle='#2f4a6b';c.fillRect(-13,-40,10,40);c.fillRect(3,-40,10,40);c.fillStyle=o.shirt;rr(-18,-94,36,58,9);c.fill();
 c.fillStyle=o.skin;c.beginPath();c.arc(0,-110,18,0,7);c.fill();c.fillRect(-26,-88,8,26);c.fillRect(18,-88,8,26);
 c.fillStyle='#2b1d10';c.beginPath();c.arc(-6,-112,2.4,0,7);c.arc(6,-112,2.4,0,7);c.fill();
 c.strokeStyle='#7a3b2a';c.lineWidth=2;c.beginPath();talk?c.ellipse(0,-102,4,2+Math.abs(Math.sin(T*14))*3,0,0,7):(c.moveTo(-5,-102),c.quadraticCurveTo(0,-98,5,-102));c.stroke();
 if(o.hat){c.fillStyle='#e8d28a';c.beginPath();c.moveTo(-36,-118);c.lineTo(36,-118);c.lineTo(0,-158);c.closePath();c.fill();c.strokeStyle='#b99a4a';c.stroke()}
 else{c.fillStyle='#2b1d10';c.beginPath();c.arc(0,-116,19,Math.PI,0);c.fill();c.beginPath();c.arc(-22,-100,7,0,7);c.arc(22,-100,7,0,7);c.fill()}c.restore()}

function ambient(){const sc=[392,440,523,587,659,587,523,440];let k=0;setInterval(()=>{if(mute)return;k=(k+1)%8;if(Math.random()<.7)tone(sc[k],.5,'triangle',MUSIC_VOL*1.2);if(k%4==0)tone(sc[k]/2,1.2,'sine',MUSIC_VOL)},480)}
const TL=(k,n)=>({x:480-(n-1)*95-85+k*190,y:440});
function newAct(i,re){const a=story.acts[i];st={i,a,mode:'talk',tries:st.i===i?st.tries:0,hints:st.i===i?st.hints:0,noted:0,ti:0,cx:[300,520],pf:1200,pl:75,fs:[900,1500,2200],tools:[],ex:480,val:100,rd:0};
 $('hAct').textContent=`Chặng ${i+1}/${story.acts.length} · ${a.name}`;$('hSc').textContent=score;$('meter').textContent=a.goal;
 const go=()=>{st.mode='play';st.tools=(a.tools||[]).map((t,k)=>({...t,k,x:TL(k,a.tools.length).x,y:440}));a.type=='input'&&openInput()};re?go():say(a.intro,go)}
function actWin(){SND.win();confetti();const a=st.a,g=Math.max(30,100-st.tries*15-st.hints*10);score+=g;$('hSc').textContent=score;ev('success',{act:st.i,tries:st.tries});say([...a.win,['me',`+${g} điểm`]],()=>st.i+1<story.acts.length?newAct(st.i+1):finish())}
function oops(m){st.tries++;SND.fail();ev('wrong_answer',{act:st.i,tries:st.tries});$('dlg').style.display='none';say([[st.a.mentor,m]],()=>{st.mode='play';st.a.type=='input'&&openInput()})}
function openInput(){const a=st.a;st.mode='input';$('pop').style.display='flex';$('pop').innerHTML=`<div class="card"><h2>${a.title}</h2><p>${a.prompt}</p>${a.fields.map((f,k)=>`<p>${f.label} <input id="f${k}" type="number" step="any" style="width:120px;font-size:18px;padding:4px"> ${f.unit}</p>`).join('')}<p id="fe" style="color:#a33;font-weight:700"></p><p><button class="btn" onclick="checkInput()">✔ Xác nhận</button> <button class="btn s" onclick="hintInput()">📓 Gợi ý</button></p></div>`}
function hintInput(){if(!st.noted){st.noted=1;st.hints++}ev('hint',{act:st.i});SND.note();$('fe').innerHTML=st.a.note}
function checkInput(){const bad=st.a.fields.filter((f,k)=>!(Math.abs(parseFloat($('f'+k).value)-f.ans)<=(f.tol||0)));$('pop').style.display='none';bad.length?oops(bad.map(f=>f.hint).join(' ')):actWin()}
$('bNote').onclick=()=>{if(st.mode!='play')return;if(!st.noted){st.noted=1;const t=+localStorage.getItem('hdlg_hints')||0;if(t>0)localStorage.setItem('hdlg_hints',t-1);else st.hints++}ev('hint',{act:st.i});SND.note();$('pop').style.display='flex';$('pop').innerHTML=`<div class="card"><h2>📓 Sổ tay</h2>${st.a.note}<p style="margin-top:12px"><button class="btn" onclick="$('pop').style.display='none'">Đã hiểu</button></p></div>`};
let drag=null;const pt=e=>{const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/stage._s,y:(e.clientY-r.top)/stage._s}};
function pickDown(m){for(const t of st.tools)if(m.x>t.x&&m.x<t.x+170&&m.y>t.y&&m.y<t.y+70){drag={t,dx:m.x-t.x,dy:m.y-t.y};SND.pick();return}}
cv.onpointermove=e=>{if(drag){const m=pt(e);drag.t.x=m.x-drag.dx;drag.t.y=m.y-drag.dy}};
cv.onpointerup=()=>{if(!drag)return;const t=drag.t;drag=null;if(Math.hypot(t.x+85-480,t.y+35-205)<150&&st.a.type=='pick'){const k=st.a.tasks[st.ti],r=st.a.judge(t,k,st.tools);ev('change_parameter',{tool:t.n,task:k.n,ok:!!r.ok});if(r.ok){st.ti++;SND.thud();st.ti>=st.a.tasks.length?actWin():say([[st.a.mentor,r.msg]],()=>st.mode='play')}else oops(r.msg)}else SND.pick()};
cv.onpointerdown=e=>{if(st.mode=='play'&&st.a.type=='pick')pickDown(pt(e))};
function pickDraw(){const a=st.a,k=a.tasks[Math.min(st.ti,a.tasks.length-1)];c.fillStyle='rgba(255,247,224,.96)';rr(330,96,300,214,18);c.fill();c.strokeStyle='#c98a2b';c.lineWidth=5;c.stroke();c.textAlign='center';c.fillStyle='#a8590a';c.font='bold 13px Arial';c.fillText(`NHIỆM VỤ ${Math.min(st.ti+1,a.tasks.length)}/${a.tasks.length}`,480,120);c.font='64px serif';c.fillStyle='#000';c.fillText(k.e,480,196);c.fillStyle='#3a2a10';c.font='bold 22px Arial';c.fillText(k.n,480,238);c.font='14px Arial';c.fillText(k.t,480,266);c.fillStyle='#8a6a3a';c.font='12px Arial';c.fillText('⬇ kéo dụng cụ phù hợp thả vào đây',480,296);
 st.tools.forEach(t=>{if(!(drag&&drag.t==t)){const q=TL(t.k,st.tools.length);t.x+=(q.x-t.x)*.3;t.y+=(q.y-t.y)*.3}});[...st.tools].sort((x,y)=>(drag&&drag.t==x)-(drag&&drag.t==y)).forEach(t=>{c.fillStyle='#fff7e0';rr(t.x,t.y,170,70,14);c.fill();c.strokeStyle='#c98a2b';c.lineWidth=4;c.stroke();c.fillStyle='#3a2a10';c.font='bold 15px Arial';c.fillText(t.e+' '+t.n,t.x+85,t.y+30);c.font='11.5px Arial';c.fillStyle='#6a4a1a';c.fillText(t.s,t.x+85,t.y+52)})}
function loop(t){T=t/1000;const a=st.a;$('bGo').style.display=(st.mode=='play')?'block':'none';if(typed<full.length){const b4=Math.floor(typed);typed+=.9;if(Math.floor(typed)!=b4&&b4%2==0&&full[b4]!=' ')SND.talk(st.who);show()}draw();requestAnimationFrame(loop)}
function peopleAndParticles(){if(st.mode=='talk')PEO.forEach(q=>person(q.x,470,q,st.who==q.id&&typed<full.length,st.who==q.id));P=P.filter(p=>p.l-->0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||.15;c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill()})}
const start=async()=>{if(LESSON_ID){try{const g=await api(`/content/lessons/${LESSON_ID}/games`);if(g[0])sid=(await api('/games/sessions',{method:'POST',body:JSON.stringify({user_id:USER_ID,game_id:g[0].id})})).id}catch(e){}}st={i:-1,a:story.acts[0]};newAct(0);requestAnimationFrame(loop)};

const WHO={thanh:'Chị Thanh · trưởng phòng an toàn',tuan:'Anh Tuấn · lái xe nâng',me:'Bạn · kỹ sư an toàn lao động'};
/* =========================================================
   SỐ LIỆU (sửa tại đây). Độ to tính bằng dB. Tiếng ồn máy cẩu dồn ở dải tần thấp (~450 Hz).
   Tiêu chuẩn: nghe rõ hơn ồn ≥ 10 dB · không vượt 95 dB · tần số ≤ 4000 Hz (người lớn tuổi vẫn nghe được)
========================================================= */
const STORY={reveal:{formula:'f = 1 / T   (f: tần số, Hz · T: chu kỳ, s)   |   Tần số càng cao → âm càng cao, biên độ càng lớn → âm càng to',jobs:['Kỹ sư an toàn lao động','Kỹ sư âm thanh / thiết kế còi báo động','Kỹ thuật viên sonar, đo kiểm công nghiệp'],text:'Còi xe lùi, chuông cẩu, báo cháy đều được thiết kế dựa trên tần số và độ to. Chọn tần số tránh dải tiếng ồn, đủ to để nghe rõ nhưng không hại tai, và phân biệt được từng loại cảnh báo là cách cứu mạng người ở những nơi ồn ào.'},acts:[
{name:'Đọc dao động',type:'scope',mentor:'thanh',goal:'Kéo 2 con trỏ vào 2 đỉnh sóng liên tiếp để đo chu kỳ T',sigs:[{n:'Còi xe nâng cũ',T:2.5},{n:'Chuông cẩu',T:.8}],
 note:'<p><b>Chu kỳ T</b> là thời gian dao động lặp lại một lần: khoảng cách giữa hai đỉnh sóng liên tiếp. <b>Tần số f = 1/T</b>, đơn vị Hz.</p><p>Đổi ms sang giây trước khi tính: 2,5 ms = 0,0025 s.</p>',
 intro:[['me','Cảng container, năm giờ chiều. Hôm qua một xe nâng lùi mà không ai nghe thấy tín hiệu, suýt cán phải công nhân.'],['thanh','Tôi là Thanh, trưởng phòng an toàn. Hệ thống cảnh báo cũ không ai biết thông số. Trước khi thiết kế cái mới, em phải đọc được dao động của tín hiệu.'],['thanh','Trên máy hiện sóng, kéo hai con trỏ vào hai đỉnh sóng liên tiếp để đo chu kỳ T, rồi tính tần số f = 1/T. Bấm Nghe tín hiệu để nghe thử.']],win:[['thanh','Đúng rồi. Chu kỳ càng ngắn thì tần số càng cao, âm càng the thé.']]},
{name:'Át tiếng ồn',type:'chart',mentor:'tuan',goal:'Kéo chấm vàng chọn tần số và độ to cho tín hiệu xe lùi',
 note:'<p>Vùng đỏ là <b>tiếng ồn</b> theo tần số: máy cẩu dồn ở 300 đến 1000 Hz, máy đóng cọc dồn quanh 2500 Hz. Tín hiệu phải nằm <b>cao hơn vùng đỏ ít nhất 10 dB</b>.</p><p>Tai người nhạy nhất ở 2000 đến 4000 Hz. Độ to chỉ được tối đa 95 dB. Thay vì hét to hơn, hãy đổi tần số tránh dải ồn.</p>',
 intro:[['tuan','Tôi lái xe nâng mười lăm năm rồi. Khu cẩu bốc hàng ồn lắm, tiếng máy dồn ở dải thấp, nghe tín hiệu nào cũng chìm.'],['thanh','Em chọn tần số và độ to cho tín hiệu xe lùi. Phải nghe rõ hơn tiếng ồn ít nhất 10 dB, nhưng không vượt 95 dB vì hại tai công nhân. Vùng đỏ trên biểu đồ là tiếng ồn.']],win:[['tuan','Tín hiệu này tôi nghe rõ giữa tiếng máy. Chọn tần số tránh dải ồn là mẹo đúng!']]},
{name:'Hệ thống 3 cảnh báo',type:'trio',mentor:'thanh',goal:'Đặt tần số cho 3 cảnh báo và chỉnh độ to chung',
 note:'<p>Âm yếu dần theo khoảng cách: ở 25 m yếu đi khoảng <b>14 dB</b>, ở 100 m yếu đi khoảng <b>26 dB</b>. Công nhân xa nhất vẫn phải nghe rõ, người gần nhất (5 m) không được vượt 95 dB.</p><p>Ba tín hiệu phải cách nhau ít nhất 30% tần số để phân biệt được, và <b>khẩn cấp phải cao nhất</b>.</p>',
 intro:[['thanh','Giai đoạn cuối: ba loại cảnh báo gồm xe lùi, cẩu hạ hàng và khẩn cấp phải phân biệt được bằng độ cao. Công nhân ở xa 100 m vẫn nghe rõ, người gần 5 m không bị chói tai.'],['tuan','Âm yếu dần theo khoảng cách, 100 m xa là mất đi 26 dB. Tín hiệu khẩn cấp phải cao nhất để ai nghe cũng giật mình.']],win:[['thanh','Hệ thống đạt chuẩn. Ba tín hiệu rõ ràng, người xa nghe được, người gần không hại tai. Em ký duyệt được rồi đó.']]}]};
story=STORY;
const PEO=[{x:110,ph:0,s:1,shirt:'#e0b81e',skin:'#d9a06f',hat:0,id:'thanh'},{x:190,ph:2,s:.95,shirt:'#3a6ea8',skin:'#e8b890',hat:0,id:'tuan'}];
/* ---- âm học (hàm thuần) ---- */
const WT=[[100,-19],[200,-10],[500,-3],[1000,0],[2000,1.2],[3000,1.5],[4000,1],[6000,-1],[10000,-5]];
function pw(f){for(let i=1;i<WT.length;i++)if(f<=WT[i][0]){const a=WT[i-1],b=WT[i],t=(Math.log10(f)-Math.log10(a[0]))/(Math.log10(b[0])-Math.log10(a[0]));return a[1]+(b[1]-a[1])*t}return WT[WT.length-1][1]}
const bgN=f=>45+38*Math.exp(-Math.pow((Math.log10(f)-Math.log10(450))/.35,2))+30*Math.exp(-Math.pow((Math.log10(f)-Math.log10(2500))/.12,2));
function ev2(f,L){const m=L+pw(f)-bgN(f);if(f>4000)return{ok:0,msg:'Tần số '+fmt(f,0)+' Hz quá cao, người lớn tuổi khó nghe. Giữ tần số không quá 4000 Hz.'};if(L>95)return{ok:0,msg:`Độ to ${fmt(L,0)} dB vượt 95 dB, hại tai công nhân. Thay vì tăng độ to, hãy chọn tần số tránh dải ồn.`};if(m<10)return{ok:0,msg:`Tín hiệu chỉ cao hơn tiếng ồn ${fmt(m,0)} dB (cần ít nhất 10 dB) nên bị chìm. Chọn tần số tránh hai dải ồn (máy cẩu và đóng cọc) hoặc tăng độ to.`};return{ok:1}}
const FAR=-26,NOISE3=52;
function ev3(fs,L){const s=[...fs].sort((a,b)=>a-b);if(L>95)return{ok:0,msg:`Độ to ${fmt(L,0)} dB vượt 95 dB, công nhân đứng gần 5 m bị chói tai, hại thính giác.`};
 for(let i=0;i<3;i++){if(fs[i]>4000||fs[i]<800)return{ok:0,msg:`Tần số ${fmt(fs[i],0)} Hz ngoài khoảng 800 đến 4000 Hz: quá trầm dễ lẫn tiếng máy hoặc quá cao người lớn tuổi khó nghe.`};const m=L+FAR+pw(fs[i])-NOISE3;if(m<10)return{ok:0,msg:`Công nhân ở 100 m nghe tín hiệu ${fmt(fs[i],0)} Hz chỉ cao hơn nền ${fmt(m,0)} dB (cần ≥ 10 dB). Tăng độ to (nhưng không quá 95 dB) hoặc dùng tần số tai nhạy hơn (2000 đến 4000 Hz).`}}
 if(s[1]/s[0]<1.3||s[2]/s[1]<1.3)return{ok:0,msg:'Hai tín hiệu quá gần nhau về tần số, công nhân không phân biệt được. Cách nhau ít nhất 30%.'};if(fs[2]<s[2]-1e-6)return{ok:0,msg:'Tín hiệu khẩn cấp phải có tần số cao nhất để gây chú ý.'};return{ok:1}}
/* ---- ánh xạ giao diện ---- */
const LF=Math.log10(200),LH=Math.log10(5000),FXA=(x0,w,f)=>x0+(Math.log10(f)-LF)/(LH-LF)*w,FXI=(x0,w,x)=>Math.pow(10,LF+Math.max(0,Math.min(1,(x-x0)/w))*(LH-LF));
const PXMS=140,SX0=60,vv=L=>Math.min(.2,.02*Math.pow(10,(L-80)/20));
const BT={x:700,y:440,w:210,h:44};let dg=null;
function listen(){const a=st.a;if(a.type=='scope')tone(1000/a.sigs[st.rd].T,.9,'sine',.07);else if(a.type=='chart')[0,1,2].forEach(i=>tone(st.pf,.25,'sine',vv(st.pl),i*.4));else st.fs.forEach((f,k)=>[0,1].forEach(j=>tone(f,.22,'sine',vv(st.pl),k*.9+j*.35)));SND.pick()}
cv.onpointerdown=e=>{if(st.mode!='play')return;const m=pt(e),a=st.a;if(m.x>BT.x&&m.x<BT.x+BT.w&&m.y>BT.y&&m.y<BT.y+BT.h)return listen();
 if(a.type=='scope'){let b=0;if(Math.abs(m.x-st.cx[1])<Math.abs(m.x-st.cx[0]))b=1;if(Math.abs(m.x-st.cx[b])<40)dg={k:'c',i:b}}
 else if(a.type=='chart'){if(m.x>90&&m.x<650&&m.y>110&&m.y<390)dg={k:'p'}}
 else{if(m.y>215&&m.y<290){let b=0,bd=40;st.fs.forEach((f,i)=>{const q=Math.abs(m.x-FXA(170,560,f));if(q<bd){bd=q;b=i;dg={k:'f',i}}})}else if(m.x<110&&m.y>110&&m.y<400)dg={k:'l'}}
 dg&&(cv.setPointerCapture(e.pointerId),SND.pick(),cv.onpointermove(e))};
cv.onpointermove=e=>{if(!dg)return;const m=pt(e);if(dg.k=='c')st.cx[dg.i]=Math.max(SX0,Math.min(900,m.x));else if(dg.k=='p'){st.pf=FXI(90,560,m.x);st.pl=Math.max(40,Math.min(110,40+(380-m.y)/260*70))}else if(dg.k=='f')st.fs[dg.i]=FXI(170,560,m.x);else if(dg.k=='l')st.pl=Math.max(60,Math.min(110,60+(400-m.y)/290*50))};
cv.onpointerup=()=>{if(dg){ev('change_parameter',{f:Math.round(st.pf),L:Math.round(st.pl)});dg=null}};
function askF(){const a=st.a,s=a.sigs[st.rd],Tm=Math.abs(st.cx[1]-st.cx[0])/PXMS;st.mode='input';$('pop').style.display='flex';$('pop').innerHTML=`<div class="card"><h2>🧮 Tính tần số</h2><p>${s.n}: chu kỳ đo được <b>T ≈ ${fmt(Tm,2)} ms</b> = ${fmt(Tm/1000,5)} s.</p><p>f = 1 / T = <input id="ff" type="number" step="any" style="width:110px;font-size:18px;padding:4px"> Hz</p><p><button class="btn" onclick="checkF()">✔ Xác nhận</button></p></div>`}
function checkF(){const a=st.a,s=a.sigs[st.rd],v=parseFloat($('ff').value),ans=1000/s.T;$('pop').style.display='none';
 if(Math.abs(v-ans)/ans<=.06){if(st.rd<a.sigs.length-1){SND.thud();st.rd++;st.cx=[300,520];say([['thanh','Đúng rồi. Tín hiệu tiếp theo.']],()=>st.mode='play')}else actWin()}
 else oops(`Tần số f = 1 / T = 1 / ${fmt(s.T/1000,4)} s = ${fmt(ans,0)} Hz. Nhớ đổi ms sang giây (1 ms = 0,001 s).`)}
$('bGo').onclick=()=>{if(st.mode!='play')return;const a=st.a;if(a.type=='scope'){const T=Math.abs(st.cx[1]-st.cx[0])/PXMS,T0=a.sigs[st.rd].T;if(Math.abs(T-T0)/T0<=.08)askF();else oops(`Hai con trỏ đang cách nhau ${fmt(T,2)} ms. Chu kỳ là khoảng cách giữa hai đỉnh sóng liên tiếp, đặt con trỏ đúng đỉnh nhé.`);return}
 const r=a.type=='chart'?ev2(st.pf,st.pl):ev3(st.fs,st.pl);r.ok?actWin():oops(r.msg)};
/* ---- vẽ ---- */
function bg(){let g=c.createLinearGradient(0,0,0,540);g.addColorStop(0,'#1a2a4a');g.addColorStop(1,'#d9884a');c.fillStyle=g;c.fillRect(0,0,960,540);c.fillStyle='#10161f';c.fillRect(0,470,960,70);[[40,40],[300,90],[640,60],[870,100]].forEach(([x,h])=>{c.fillStyle='#232b36';c.fillRect(x,470-h-60,12,h+60);c.fillRect(x-70,470-h-60,170,8)});[['#8a3a2a',20],['#2f5a8a',90],['#5a7a3a',160],['#8a6a2a',230]].forEach(([col,x])=>{c.fillStyle=col;c.fillRect(x+640,430,66,40);c.fillRect(x+650,390,66,40)})}
const panel=(x,y,w,h)=>{c.fillStyle='rgba(8,20,40,.88)';rr(x,y,w,h,14);c.fill();c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=2;c.stroke()};
function btn(){c.fillStyle='#ffd166';rr(BT.x,BT.y,BT.w,BT.h,12);c.fill();c.fillStyle='#4a2c00';c.font='bold 17px Arial';c.textAlign='center';c.fillText('🔊 Nghe tín hiệu',BT.x+BT.w/2,BT.y+28)}
function wave(x0,y0,w,h,f,amp,col){c.strokeStyle=col;c.lineWidth=2;c.beginPath();for(let i=0;i<=w;i+=2){const y=y0-Math.sin((i/w)*f*Math.PI*2)*amp*h;i?c.lineTo(x0+i,y):c.moveTo(x0+i,y)}c.stroke()}
function draw(){const a=st.a;c.clearRect(0,0,960,540);bg();c.textAlign='center';
 if(a.type=='scope'){const s=a.sigs[st.rd];panel(40,90,880,310);c.fillStyle='#071;';c.fillStyle='#04180c';c.fillRect(SX0,110,840,270);c.strokeStyle='rgba(80,255,140,.15)';c.lineWidth=1;for(let ms=0;ms<=6;ms++){const x=SX0+ms*PXMS;c.beginPath();c.moveTo(x,110);c.lineTo(x,380);c.stroke();c.fillStyle='#7dffa6';c.font='12px Arial';c.fillText(ms+' ms',x,396)}c.beginPath();c.moveTo(SX0,245);c.lineTo(900,245);c.stroke();
  c.strokeStyle='#4aff8a';c.lineWidth=3;c.beginPath();for(let x=0;x<=840;x+=2){const t=x/PXMS,y=245-Math.cos(2*Math.PI*(t-.3)/s.T)*95;x?c.lineTo(SX0+x,y):c.moveTo(SX0+x,y)}c.stroke();
  c.fillStyle='#fff';c.font='bold 15px Arial';c.textAlign='left';c.fillText('Tín hiệu: '+s.n+' ('+(st.rd+1)+'/'+a.sigs.length+')',60,138);
  st.cx.forEach((x,i)=>{c.strokeStyle='#ffd84a';c.lineWidth=3;c.beginPath();c.moveTo(x,110);c.lineTo(x,380);c.stroke();c.fillStyle='#ffd84a';c.beginPath();c.arc(x,245,9,0,7);c.fill()});
  c.fillStyle='#ffd84a';c.font='bold 22px Arial';c.textAlign='center';c.fillText('T = '+fmt(Math.abs(st.cx[1]-st.cx[0])/PXMS,2)+' ms',480,440);btn()}
 else if(a.type=='chart'){panel(40,90,640,330);const X=f=>FXA(90,560,f),Y=L=>380-(L-40)/70*260;c.fillStyle='#0a1a2c';c.fillRect(90,120,560,260);
  c.fillStyle='rgba(255,70,70,.55)';c.beginPath();c.moveTo(90,380);for(let x=90;x<=650;x+=4)c.lineTo(x,Y(bgN(FXI(90,560,x))));c.lineTo(650,380);c.fill();c.fillStyle='rgba(255,70,70,.18)';c.beginPath();c.moveTo(90,380);for(let x=90;x<=650;x+=4)c.lineTo(x,Y(bgN(FXI(90,560,x))+10));c.lineTo(650,380);c.lineTo(650,380);c.fill();
  c.strokeStyle='#ff4a4a';c.setLineDash([8,6]);c.lineWidth=2;c.beginPath();c.moveTo(90,Y(95));c.lineTo(650,Y(95));c.stroke();c.setLineDash([]);c.fillStyle='#ff8a8a';c.font='bold 12px Arial';c.textAlign='left';c.fillText('95 dB: hại tai',96,Y(95)-6);c.fillText('Máy cẩu',130,Y(60)+4);c.fillText('Đóng cọc',X(2500)-26,Y(82)-8);
  c.fillStyle='#fff';c.textAlign='center';c.font='11px Arial';[200,500,1000,2000,4000].forEach(f=>c.fillText(f+' Hz',X(f),398));[40,60,80,100].forEach(L=>c.fillText(L+' dB',64,Y(L)+4));c.strokeStyle='rgba(255,255,255,.4)';c.setLineDash([4,6]);c.beginPath();c.moveTo(X(4000),120);c.lineTo(X(4000),380);c.stroke();c.setLineDash([]);
  const r=ev2(st.pf,st.pl);c.fillStyle=r.ok?'#4aff8a':'#ffd84a';c.beginPath();c.arc(X(st.pf),Y(st.pl),13,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=3;c.stroke();
  panel(700,90,220,160);c.fillStyle='#04180c';c.fillRect(712,100,196,70);wave(712,135,196,1,Math.min(14,st.pf/330),(st.pl-40)/70*.45,'#4aff8a');c.fillStyle='#fff';c.font='bold 14px Arial';c.textAlign='left';c.fillText('Tần số: '+fmt(st.pf,0)+' Hz',714,196);c.fillText('Độ to: '+fmt(st.pl,0)+' dB',714,216);c.fillStyle=r.ok?'#7dffa6':'#ff9a9a';c.fillText(r.ok?'✔ Nghe rõ, an toàn':'✖ Chưa đạt',714,238);btn()}
 else{panel(40,90,880,330);const X=f=>FXA(170,560,f);c.fillStyle='#fff';c.font='bold 13px Arial';c.textAlign='center';c.fillText('TẦN SỐ (Hz)',450,150);c.strokeStyle='#8fa6bd';c.lineWidth=3;c.beginPath();c.moveTo(170,250);c.lineTo(730,250);c.stroke();[200,500,1000,2000,4000].forEach(f=>{c.fillStyle='#9fc2e0';c.font='11px Arial';c.fillText(f,X(f),282)});
  [[800,'rgba(255,120,120,.25)'],[4000,'rgba(255,120,120,.25)']].forEach(([f,col])=>{c.fillStyle=col;c.fillRect(f==800?170:X(4000),235,f==800?X(800)-170:730-X(4000),30)});
  const nm=['🚜 Xe lùi','🏗️ Cẩu hạ hàng','🚨 Khẩn cấp'],col=['#4ac3ff','#ffd84a','#ff6a6a'];st.fs.forEach((f,i)=>{c.fillStyle=col[i];c.beginPath();c.arc(X(f),250,13,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=3;c.stroke();c.fillStyle=col[i];c.font='bold 13px Arial';c.fillText(nm[i],X(f),222-i*16);c.fillStyle='#fff';c.font='11px Arial';c.fillText(fmt(f,0)+' Hz',X(f),312+i*0)});
  c.fillStyle='#0b1118';rr(55,110,36,290,10);c.fill();const ly=400-(st.pl-60)/50*290;c.fillStyle=st.pl>95?'#ff4a4a':'#4aff8a';rr(55,ly,36,400-ly,10);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(73,ly,13,0,7);c.fill();c.font='bold 13px Arial';c.fillText(fmt(st.pl,0)+' dB',73,100);
  const near=st.pl,far=st.pl+FAR;[['5 m',near,'👷'],['25 m',st.pl-14,'👷'],['100 m',far,'👷']].forEach(([n,L,e],i)=>{const x=180+i*170;c.fillStyle='rgba(255,255,255,.08)';rr(x-10,330,150,76,10);c.fill();c.font='24px serif';c.fillStyle='#fff';c.fillText(e,x+30,358);c.font='bold 12px Arial';c.fillText('Cách '+n,x+30,376);c.fillStyle=L>95?'#ff8a8a':'#9fe8b0';c.fillText(fmt(L,0)+' dB nhận',x+30,394);c.fillStyle='#fff';c.fillText(i==2?'(nhiễu nền 52 dB)':'',x+84,376)});
  const r=ev3(st.fs,st.pl);c.fillStyle=r.ok?'#7dffa6':'#ffb3b3';c.font='bold 14px Arial';c.fillText(r.ok?'✔ Đạt chuẩn':'✖ '+r.msg.slice(0,78)+(r.msg.length>78?'…':''),450,188);btn()}
 const m=st.mode=='play'?a.goal:null;if(m&&m!=st.mm){st.mm=m;$('meter').textContent=m}
 $('bGo').classList.toggle('ready',a.type=='chart'?!!ev2(st.pf,st.pl).ok:a.type=='trio'?!!ev3(st.fs,st.pl).ok:false);peopleAndParticles()}
