<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="mobile-fit.js"></script>
<title>Thử thách thực tế - HỌC ĐỂ LÀM GÌ?</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(160deg,#0f2447,#1d4a7a 60%,#2b6a8f);color:#fff;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:rgba(0,0,0,.25)}
button{font:inherit;cursor:pointer;border:0}
.back{background:rgba(255,255,255,.15);color:#fff;padding:8px 14px;border-radius:10px}
.score{font-weight:800;color:#ffd166}
main{max-width:980px;margin:0 auto;padding:18px}
.card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:20px;margin-bottom:16px;backdrop-filter:blur(6px)}
h1{font-size:26px;margin-bottom:8px}h2{font-size:18px;margin-bottom:6px;color:#ffd166}
p{line-height:1.55;margin:6px 0}
.big{padding:12px 22px;border-radius:12px;background:#ffd166;color:#4a2c00;font-weight:800;font-size:16px;margin-top:10px}
.big.alt{background:rgba(255,255,255,.18);color:#fff}
.game{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:760px){.game{grid-template-columns:1fr}}
canvas{width:100%;border-radius:14px;background:#cfe8ff;display:block}
.sl{margin:12px 0}.sl label{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
input[type=range]{width:100%;accent-color:#ffd166}
.m{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;background:rgba(0,0,0,.2);margin:5px 0;font-size:14px}
.m.bad{background:rgba(255,80,80,.35)}
.res{padding:12px;border-radius:12px;margin-top:12px;font-weight:600;line-height:1.5}
.res.ok{background:rgba(60,200,120,.35)}.res.no{background:rgba(255,90,90,.35)}
.dots span{display:inline-block;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.3);margin-right:6px}
.dots .on{background:#ffd166}.dots .done{background:#5ee08e}
.tag{display:inline-block;background:#ffd166;color:#4a2c00;border-radius:20px;padding:2px 12px;font-weight:800;font-size:12px;margin:4px 4px 0 0}
.guide-box{background:rgba(9,20,40,.55);border-left:4px solid #ffd166;border-radius:10px;padding:10px 14px;margin-top:8px;font-size:14px;line-height:1.55}
</style>
<script src="/firebase-config.js"></script><script src="/auth.js"></script><script src="/games/hdlg-game.js"></script>
</head>
<body>
<header>
  <button class="back" onclick="goBack()">← Quay lại bài học</button>
  <div class="score">⭐ <span id="score">0</span> điểm</div>
</header>
<main id="app"></main>

<script>
/* =========================================================
   GAME TÌNH HUỐNG DÙNG CHUNG — lessons có game_type = "simulation"
   Trang này tự đọc ?lesson_id=..., lấy bài học từ backend, rồi chọn
   màn chơi trong SCENARIOS theo "topic" của bài (CT GDPT 2018).
========================================================= */
const API = window.HOC_API_BASE || (["127.0.0.1","localhost"].includes(location.hostname)&&location.port!=="8000"?"http://127.0.0.1:8000/api":"/api");
const Q = new URLSearchParams(location.search);
const LESSON_ID = Q.get('lesson_id');
const USER_ID = Number(localStorage.getItem('user_id')) || 1;
const $ = id => document.getElementById(id);
const fmt = (n, d = 2) => Number(n).toLocaleString('vi-VN', { maximumFractionDigits: d });

const ALIAS = { 'toc-do': 'toc-do-chuyen-dong', 'dinh-luat-ohm': 'dien-tro', 'dong-dien': 'dien-tro' };

const SCENARIOS = {

/* ---------- KHTN 8: Khối lượng riêng & Thực hành xác định khối lượng riêng ---------- */
'khoi-luong-rieng': {
  icon: '🧱', title: 'Xưởng Đúc & Kiểm Định Vật Liệu (KHTN 8: Khối lượng riêng D = m / V)',
  story: 'Bạn là kỹ sư kiểm định vật liệu tại xưởng cơ khí. Mỗi chi tiết máy đòi hỏi đúng khối lượng m và thể tích V để đạt khối lượng riêng D = m / V (g/cm³ hoặc kg/m³) theo thiết kế. Hãy tính toán từ thông số của từng ca rồi kéo thanh trượt chọn khối lượng m và thể tích V chính xác!',
  params: [
    { k: 'm', label: 'Khối lượng phôi đúc (m)', unit: 'g', min: 100, max: 3000, step: 50, v: 500 },
    { k: 'V', label: 'Thể tích khuôn đúc (V)', unit: 'cm³', min: 50, max: 1000, step: 25, v: 200 }
  ],
  rounds: [
    {
      brief: '<b>Ca 1 · Đúc chi tiết Hợp kim Nhôm nhẹ:</b> Thiết kế máy bay mô hình cần một phôi nhôm đặc có thể tích khuôn từ <b>200 đến 400 cm³</b>.<br>📊 <b>Thông số:</b> Khối lượng riêng của nhôm chuẩn là <b>D = 2,7 g/cm³</b> (cho phép sai số từ <b>2,6 đến 2,8 g/cm³</b>); thể tích yêu cầu <b>200 ≤ V ≤ 400 cm³</b>.<br>📐 <b>Công thức:</b> D = m / V ⇒ m = D · V (ví dụ chọn V = 250 cm³ thì m = 2,7 × 250 = 675 g ≈ 650–700 g; hoặc V = 300 cm³ thì m = 800 g).<br>🎯 <b>Chốt nhiệm vụ:</b> Kéo thanh trượt <b>Thể tích V</b> trong khoảng 200–400 cm³ và chỉnh <b>Khối lượng m</b> sao cho D = m / V nằm trong 2,6–2,8 g/cm³, rồi bấm <b>✔ Kiểm tra</b>!',
      env: { Dmin: 2.6, Dmax: 2.8, Vmin: 200, Vmax: 400, mat: 'Hợp kim Nhôm (D ≈ 2,7 g/cm³)', liqD: 1.0 }
    },
    {
      brief: '<b>Ca 2 · Chế tạo Phao cứu sinh nổi trên nước:</b> Xưởng cần đúc khối phao xốp đặc có khối lượng <b>m ≥ 400 g</b> để chịu va đập, nhưng phải nổi cao trên mặt nước ngọt.<br>📊 <b>Thông số:</b> Nước ngọt có D_nước = 1,0 g/cm³; để phao nổi ít nhất một nửa thể tích trên mặt nước thì khối lượng riêng phao phải đạt <b>0,45 ≤ D ≤ 0,55 g/cm³</b> và khối lượng <b>m ≥ 400 g</b> (thể tích khuôn V ≥ 800 cm³).<br>📐 <b>Công thức:</b> D = m / V ∈ [0,45; 0,55] g/cm³ (ví dụ với V = 900 cm³ thì m = 0,5 × 900 = 450 g).<br>🎯 <b>Chốt nhiệm vụ:</b> Kéo thanh trượt chọn <b>m ≥ 400 g</b> và <b>V (800–1000 cm³)</b> để D = m / V đạt 0,45–0,55 g/cm³, rồi bấm <b>✔ Kiểm tra</b>!',
      env: { Dmin: 0.45, Dmax: 0.55, Vmin: 800, Vmax: 1000, mMin: 400, mat: 'Xốp kỹ thuật nổi (D ≈ 0,5 g/cm³)', liqD: 1.0 }
    },
    {
      brief: '<b>Ca 3 · Quả đối trọng bằng Thép đặc:</b> Cần cẩu mini cần quả đối trọng bằng thép có khối lượng <b>m ≥ 1900 g</b> nhưng kích thước gọn (<b>V ≤ 300 cm³</b>).<br>📊 <b>Thông số:</b> Khối lượng riêng của thép chuẩn là <b>7,6 ≤ D ≤ 8,0 g/cm³</b>; yêu cầu <b>m ≥ 1900 g</b> và <b>250 ≤ V ≤ 300 cm³</b>.<br>📐 <b>Công thức:</b> m = D · V (với V = 250 cm³ thì m = 7,8 × 250 = 1950 g; với V = 300 cm³ thì m = 7,8 × 300 = 2340 g ≈ 2300–2400 g).<br>🎯 <b>Chốt nhiệm vụ:</b> Kéo thanh trượt đặt <b>V = 250 hoặc 275 hoặc 300 cm³</b> và chỉnh <b>m ≥ 1900 g</b> để D = m / V nằm trong 7,6–8,0 g/cm³, rồi bấm <b>✔ Kiểm tra</b>!',
      env: { Dmin: 7.6, Dmax: 8.0, Vmin: 250, Vmax: 300, mMin: 1900, mat: 'Thép đặc (D ≈ 7,8 g/cm³)', liqD: 1.0 }
    }
  ],
  calc(p, e) {
    const D = p.m / p.V, d = D * 10000;
    const dOk = D >= e.Dmin && D <= e.Dmax;
    const vOk = p.V >= e.Vmin && p.V <= e.Vmax;
    const mOk = !e.mMin || p.m >= e.mMin;
    const ok = dOk && vOk && mOk;
    let why;
    if (!dOk) why = `Khối lượng riêng D = m / V = ${fmt(D, 2)} g/cm³ nằm ngoài khoảng chuẩn [${fmt(e.Dmin, 2)}; ${fmt(e.Dmax, 2)}] g/cm³ của ${e.mat}.`;
    else if (!vOk) why = `D = ${fmt(D, 2)} g/cm³ đã đúng chất liệu, nhưng thể tích V = ${p.V} cm³ nằm ngoài yêu cầu [${e.Vmin}; ${e.Vmax}] cm³.`;
    else if (!mOk) why = `Khối lượng m = ${p.m} g chưa đủ mức tối thiểu ${e.mMin} g.`;
    else why = `Chính xác! Phôi đạt D = ${fmt(D, 2)} g/cm³ (${fmt(D * 1000, 0)} kg/m³), trọng lượng riêng d = 10·D = ${fmt(d, 0)} N/m³.`;
    return {
      ok, why, D,
      lines: [
        ['Khối lượng riêng D = m / V', fmt(D, 2) + ' g/cm³ (' + fmt(D * 1000, 0) + ' kg/m³)', !dOk],
        ['Khoảng D yêu cầu', fmt(e.Dmin, 2) + ' – ' + fmt(e.Dmax, 2) + ' g/cm³'],
        ['Thể tích khuôn V', p.V + ' cm³ (cần ' + e.Vmin + '–' + e.Vmax + ')', !vOk],
        ['Trọng lượng riêng d = 10·D', fmt(d, 0) + ' N/m³']
      ]
    };
  },
  draw(c, p, e, r) {
    c.fillStyle = '#0f172a'; c.fillRect(0, 0, 640, 300);
    c.fillStyle = '#1e293b'; c.fillRect(30, 40, 260, 220);
    c.fillStyle = '#38bdf8'; c.font = 'bold 15px Arial'; c.fillText('⚖️ Cân & Bình chia độ', 45, 68);
    const sz = Math.max(40, Math.min(130, Math.cbrt(p.V) * 13));
    c.fillStyle = r.ok ? '#34d399' : '#fbbf24';
    c.fillRect(160 - sz / 2, 190 - sz, sz, sz);
    c.strokeStyle = '#fff'; c.lineWidth = 2; c.strokeRect(160 - sz / 2, 190 - sz, sz, sz);
    c.fillStyle = '#0f172a'; c.font = 'bold 13px Arial';
    c.fillText(p.m + ' g', 135, 190 - sz / 2);
    c.fillStyle = '#e2e8f0'; c.fillText('V = ' + p.V + ' cm³', 115, 225);
    c.fillStyle = '#bae6fd'; c.fillRect(350, 120, 230, 140);
    const sinkRatio = Math.min(1.2, r.D / e.liqD);
    const by = 120 + Math.min(90, sinkRatio * 60) - 30;
    c.fillStyle = r.ok ? '#10b981' : '#f97316';
    c.fillRect(435, by, 60, 60);
    c.fillStyle = '#fff'; c.font = 'bold 14px Arial';
    c.fillText('Bể thử nước (D = 1 g/cm³)', 365, 95);
    c.fillText('D = ' + fmt(r.D, 2) + ' g/cm³', 405, 65);
  },
  reveal: {
    formula: 'D = m / V   |   d = 10 · D   |   1 g/cm³ = 1000 kg/m³',
    jobs: ['Kỹ sư vật liệu & luyện kim', 'Kiểm định viên chất lượng (QA/QC)', 'Kỹ sư đóng tàu & xây dựng'],
    text: 'Biết khối lượng riêng D = m / V giúp kỹ sư phân biệt vật liệu thật – giả, tính khối lượng các kết cấu thép khổng lồ không thể đưa lên bàn cân và thiết kế phao, tàu thuyền nổi an toàn.'
  }
},

/* ---------- KHTN 8: Áp suất trên một bề mặt & Áp suất chất lỏng ---------- */
'ap-suat': {
  icon: '🚜', title: 'Kỹ Sư Nền Móng & Thủy Lực (KHTN 8: Áp suất p = F / S)',
  story: 'Một chiếc xe tải nặng đi qua nền đất yếu rất dễ bị lún nếu diện tích tiếp xúc S quá nhỏ làm áp suất p = F / S vượt ngưỡng chịu tải của đất. Hãy tính áp lực F = 10·m và chọn diện tích tấm ván lót S phù hợp!',
  params: [
    { k: 'm', label: 'Tổng khối lượng xe & hàng (m)', unit: 'tấn', min: 2, max: 20, step: 1, v: 6 },
    { k: 'S', label: 'Diện tích tấm lót tiếp xúc (S)', unit: 'm²', min: 1, max: 10, step: 0.5, v: 2 }
  ],
  rounds: [
    {
      brief: '<b>Ca 1 · Qua đường đất nông thôn:</b> Hợp đồng yêu cầu chở ít nhất <b>m ≥ 8 tấn</b> vật liệu qua nền đất chỉ chịu được áp suất tối đa <b>p_max = 25 kPa (25 000 Pa)</b>.<br>📊 <b>Thông số:</b> m ≥ 8 tấn (8000 kg) ⇒ Áp lực F = 10·m ≥ 80 000 N (80 kN); giới hạn nền đất p ≤ 25 kPa; diện tích ván lót tối đa của kho là <b>S ≤ 4 m²</b>.<br>📐 <b>Công thức:</b> p = F / S ≤ 25 kPa (với m = 8 tấn ⇒ F = 80 kN, chọn S = 3,5 hoặc 4,0 m² thì p = 80 / 4 = 20 kPa ≤ 25 kPa).<br>🎯 <b>Chốt nhiệm vụ:</b> Chỉnh thanh trượt <b>Khối lượng m = 8–10 tấn</b> và <b>Diện tích S = 3,5–4,0 m²</b> sao cho p ≤ 25 kPa rồi bấm <b>✔ Kiểm tra</b>!',
      env: { mMin: 8, pMax: 25, sMax: 4, ground: 'Đất pha cát (p ≤ 25 kPa)' }
    },
    {
      brief: '<b>Ca 2 · Vượt bãi bùn ven sông:</b> Cần chở máy xúc nặng ít nhất <b>m ≥ 12 tấn</b> qua bãi bùn rất mềm chỉ chịu được áp suất <b>p_max = 20 kPa</b>.<br>📊 <b>Thông số:</b> m ≥ 12 tấn ⇒ F = 10·m ≥ 120 kN; p ≤ 20 kPa; kho có bộ tấm thép ghép rộng tối đa <b>S ≤ 7,5 m²</b>.<br>📐 <b>Công thức:</b> S ≥ F / p_max = 120 / 20 = 6,0 m² (chọn m = 12–14 tấn và S từ 6,0 đến 7,5 m² sao cho p = 10·m / S ≤ 20 kPa).<br>🎯 <b>Chốt nhiệm vụ:</b> Kéo thanh trượt <b>m ≥ 12 tấn</b> và tăng <b>Diện tích S (6,0–7,5 m²)</b> để giảm áp suất p ≤ 20 kPa, rồi bấm <b>✔ Kiểm tra</b>!',
      env: { mMin: 12, pMax: 20, sMax: 7.5, ground: 'Bãi bùn mềm (p ≤ 20 kPa)' }
    },
    {
      brief: '<b>Ca 3 · Đặt bồn chứa lên sàn bê tông:</b> Cần đặt bồn nước tổng khối lượng <b>m ≥ 16 tấn</b> lên sàn kho chịu áp suất tối đa <b>p_max = 18 kPa</b>.<br>📊 <b>Thông số:</b> m ≥ 16 tấn ⇒ F = 10·m ≥ 160 kN; p ≤ 18 kPa; diện tích bệ đỡ cho phép <b>S ≤ 10 m²</b>.<br>📐 <b>Công thức:</b> S ≥ F / p_max = 160 / 18 ≈ 8,9 m² (chọn m = 16–18 tấn và S = 9,0–10,0 m² để p ≤ 18 kPa).<br>🎯 <b>Chốt nhiệm vụ:</b> Đặt <b>m = 16–18 tấn</b> và <b>S = 9,0–10,0 m²</b> sao cho p = F / S ≤ 18 kPa, rồi bấm <b>✔ Kiểm tra</b>!',
      env: { mMin: 16, pMax: 18, sMax: 10, ground: 'Sàn kho (p ≤ 18 kPa)' }
    }
  ],
  calc(p, e) {
    const F = p.m * 10, pr = F / p.S; // F in kN, pr in kPa
    const mOk = p.m >= e.mMin, sOk = p.S <= e.sMax, pOk = pr <= e.pMax;
    const ok = mOk && sOk && pOk;
    let why;
    if (!pOk) why = `Lún nền! Áp suất p = F / S = ${fmt(pr, 1)} kPa vượt giới hạn chịu tải ${e.pMax} kPa của ${e.ground}. Hãy tăng diện tích bị ép S hoặc giảm bớt tải!`;
    else if (!sOk) why = `Diện tích tấm lót S = ${p.S} m² vượt quá giới hạn mặt bằng cho phép (${e.sMax} m²).`;
    else if (!mOk) why = `An toàn nhưng khối lượng m = ${p.m} tấn chưa đạt mức tối thiểu ${e.mMin} tấn của hợp đồng.`;
    else why = `Hoàn hảo! Áp lực F = ${F} kN phân bố trên S = ${p.S} m² chỉ gây áp suất p = ${fmt(pr, 1)} kPa ≤ ${e.pMax} kPa.`;
    return {
      ok, why, F, pr,
      lines: [
        ['Áp lực F = P = 10·m', F + ' kN (' + fmt(F * 1000, 0) + ' N)', !mOk],
        ['Diện tích bị ép S (tối đa ' + e.sMax + ' m²)', fmt(p.S, 1) + ' m²', !sOk],
        ['Áp suất p = F / S', fmt(pr, 1) + ' kPa (giới hạn ≤ ' + e.pMax + ' kPa)', !pOk]
      ]
    };
  },
  draw(c, p, e, r) {
    c.fillStyle = '#dbeafe'; c.fillRect(0, 0, 640, 300);
    c.fillStyle = '#78350f'; c.fillRect(0, 200, 640, 100);
    const sink = r.pr > e.pMax ? Math.min(45, (r.pr - e.pMax) * 2.2) : 4;
    const pw = 80 + p.S * 38, x = (640 - pw) / 2, y = 200 + sink;
    c.fillStyle = '#94a3b8'; c.fillRect(x, y - 14, pw, 14);
    c.fillStyle = r.ok ? '#16a34a' : '#dc2626';
    c.fillRect(240, y - 84, 160, 70);
    c.fillStyle = '#fff'; c.font = 'bold 14px Arial';
    c.fillText(`F = ${r.F} kN`, 280, y - 45);
    c.fillStyle = '#1e293b'; c.fillText(`${e.ground} · p = ${fmt(r.pr, 1)} kPa`, 20, 32);
  },
  reveal: {
    formula: 'p = F / S   (p: Pa, F: N, S: m²)   |   Áp suất chất lỏng: p = d · h',
    jobs: ['Kỹ sư xây dựng & nền móng', 'Kỹ sư chế tạo máy nông nghiệp / bánh xích', 'Kỹ sư hệ thống thủy lực'],
    text: 'Xe tăng và máy xúc dùng bản xích rộng (tăng S) để giảm áp suất p = F / S nên không lún trên bùn; ngược lại mũi kim, lưỡi dao làm S thật nhỏ để tăng áp suất giúp xuyên qua vật dễ dàng.'
  }
},

/* ---------- Vật lý 8: Lực đẩy Archimedes ---------- */
'luc-day-archimedes': {
  icon: '🚢', title: 'Thuyền chở hàng: nổi hay chìm? (KHTN 8: Lực đẩy Archimedes)',
  story: 'Bạn là chủ một chiếc thuyền chở hàng. Mỗi chuyến chở quá ít thì lỗ, chở quá nhiều thì thuyền chìm — mất cả hàng lẫn thuyền. Hãy áp dụng công thức F_A = d · V và mớn nước h_c = (m_vỏ + m_hàng) / (D · L · w) để chọn lượng hàng và bề rộng thuyền vừa lời vừa an toàn.',
  params: [
    { k: 'load', label: 'Khối lượng hàng (m_hàng)', unit: 'kg', min: 0, max: 5000, step: 50, v: 500 },
    { k: 'w', label: 'Bề rộng thuyền (w)', unit: 'm', min: 1, max: 4, step: 0.1, v: 2 }],
  rounds: [

/* =========================================================
   ENGINE
========================================================= */
let S = null, sc = null, lesson = null, ri = 0, tries = 0, score = 0, sid = null, lastEv = 0;

async function api(path, opt) {
  const r = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...opt });
  if (!r.ok) throw new Error(r.status); return r.json();
}
async function ev(action, data) { if (!sid) return; try { await api(`/games/sessions/${sid}/events`, { method: 'POST', body: JSON.stringify({ action, event_data: JSON.stringify(data || {}) }) }); } catch (e) { } }
function goBack() { if (history.length > 1) history.back(); else location.href = '../index.html'; }

async function init() {
  let topic = Q.get('topic');
  if (LESSON_ID) {
    try { lesson = await api('/content/lessons/' + LESSON_ID); topic = lesson.topic; } catch (e) { console.warn('Không tải được bài học (chạy offline):', e.message); }
  }
  topic = ALIAS[topic] || topic; sc = SCENARIOS[topic] || SCENARIOS['khoi-luong-rieng'];
  if (!sc) return noScenario();
  try { const g = await api(`/content/lessons/${LESSON_ID}/games`); if (g[0]) { const s = await api('/games/sessions', { method: 'POST', body: JSON.stringify({ user_id: USER_ID, game_id: g[0].id }) }); sid = s.id; } } catch (e) { }
  intro();
}

function noScenario() {
  $('app').innerHTML = `<div class="card"><h1>🚧 Màn chơi đang được xây dựng</h1><p>${lesson ? 'Bài "<b>' + lesson.title + '</b>" chưa có thử thách thực tế.' : 'Chưa xác định được bài học.'}</p>${lesson && lesson.real_life ? '<p><b>Ý tưởng:</b> ' + lesson.real_life + '</p>' : ''}<button class="big" onclick="goBack()">Quay lại</button></div>`;
}
function intro() {
  $('app').innerHTML = `<div class="card"><h1>${sc.icon} ${sc.title}</h1><p>${sc.story}</p>
  <div class="guide-box"><b>📘 Công thức trọng tâm:</b> ${sc.reveal.formula}<br><b>🎯 Chốt nhiệm vụ của bạn:</b> Qua <b>${sc.rounds.length} tình huống</b>, hãy đọc kỹ <b>📊 Thông số</b> và <b>📐 Công thức</b> ở đề bài từng tình huống, kéo thanh trượt điều chỉnh thông số cho khớp yêu cầu rồi bấm <b>✔ Kiểm tra</b>!</div>
  <button class="big" onclick="round(0)">Bắt đầu thực hành ▶</button></div>`;
}
function round(i) {
  ri = i; tries = 0; const R = sc.rounds[i];
  S = {}; sc.params.forEach(p => S[p.k] = p.v);
  const dots = sc.rounds.map((_, k) => `<span class="${k < i ? 'done' : k === i ? 'on' : ''}"></span>`).join('');
  $('app').innerHTML = `<div class="card"><div class="dots">${dots}</div><h2>Tình huống ${i + 1}/${sc.rounds.length}</h2><div class="guide-box">${R.brief}</div></div>
  <div class="game"><div class="card"><canvas id="cv" width="640" height="300"></canvas></div>
  <div class="card">${sc.params.map(p => `<div class="sl"><label><span>${p.label}</span><b id="v_${p.k}"></b></label><input type="range" id="r_${p.k}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.v}"></div>`).join('')}
  <div id="mt"></div><button class="big" id="chk">✔ Kiểm tra</button><div id="out"></div></div></div>`;
  sc.params.forEach(p => $('r_' + p.k).oninput = e => { S[p.k] = Number(e.target.value); live(); const n = Date.now(); if (n - lastEv > 800) { lastEv = n; ev('change_parameter', { round: i, ...S }); } });
  $('chk').onclick = check; live();
}
function live() {
  const R = sc.rounds[ri], res = sc.calc(S, R.env);
  sc.params.forEach(p => $('v_' + p.k).textContent = fmt(S[p.k], 1) + ' ' + p.unit);
  $('mt').innerHTML = res.lines.map(l => `<div class="m ${l[2] ? 'bad' : ''}"><span>${l[0]}</span><b>${l[1]}</b></div>`).join('');
  sc.draw($('cv').getContext('2d'), S, R.env, res);
}
function check() {
  const R = sc.rounds[ri], res = sc.calc(S, R.env); tries++;
  if (res.ok) {
    const gain = Math.max(30, 100 - (tries - 1) * 25); score += gain; $('score').textContent = score;
    ev('success', { round: ri, tries, ...S });
    $('out').innerHTML = `<div class="res ok">✅ ${res.why}<br>+${gain} điểm</div><button class="big" onclick="${ri + 1 < sc.rounds.length ? 'round(' + (ri + 1) + ')' : 'finish()'}">${ri + 1 < sc.rounds.length ? 'Tình huống tiếp theo →' : 'Xem kết quả →'}</button>`;
    $('chk').style.display = 'none';
  } else {
    ev('wrong_answer', { round: ri, tries, ...S }); ev('retry', { round: ri, tries });
    $('out').innerHTML = `<div class="res no">❌ ${res.why}<br>Hãy điều chỉnh rồi thử lại.</div>`;
  }
}
async function finish() {
  if (sid) { try { await api(`/games/sessions/${sid}/finish?score=${score}`, { method: 'POST' }); } catch (e) { } }
  const rv = sc.reveal, max = sc.rounds.length * 100;
  try { if (window.HDLGGame) HDLGGame.result(score, max, 30); } catch (e) { }
  $('app').innerHTML = `<div class="card"><h1>🏁 Hoàn thành! ${score}/${max} điểm</h1></div>
  <div class="card"><h2>🎓 HỌC ĐỂ LÀM GÌ?</h2><p>${rv.text}</p><p><b>Công thức bạn vừa dùng:</b> ${rv.formula}</p><p><b>Nghề dùng kiến thức này mỗi ngày:</b></p>${rv.jobs.map(j => `<span class="tag">${j}</span>`).join('')}
  <div style="margin-top:14px"><button class="big" onclick="round(0);score=0;$('score').textContent=0">Chơi lại</button> <button class="big alt" onclick="goBack()">Về bài học</button></div></div>`;
}
init();
</script>
</body>
</html>
