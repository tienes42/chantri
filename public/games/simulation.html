<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bến sông - HỌC ĐỂ LÀM GÌ?</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b1424;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#fff;user-select:none;touch-action:none}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;border-radius:14px}
canvas{position:absolute;inset:0;width:960px;height:540px}
.hud{position:absolute;display:flex;gap:8px;align-items:center}
.pill{background:rgba(10,25,50,.72);border:2px solid rgba(255,255,255,.35);border-radius:16px;padding:6px 12px;font-weight:800;font-size:14px;backdrop-filter:blur(4px)}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.btn{background:linear-gradient(#ffd166,#f4a300);color:#4a2c00;font-weight:900;border-radius:14px;padding:10px 18px;box-shadow:0 4px 0 #b06e00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b06e00}
.btn.g{background:linear-gradient(#6ee7a0,#22b866);color:#053;box-shadow:0 4px 0 #14804a}
.btn.s{padding:7px 12px;font-size:13px}.go{position:absolute;right:22px;bottom:22px;font-size:26px;padding:18px 34px;border-radius:20px;display:none;z-index:5}.go.ready{animation:pl .8s infinite}@keyframes pl{50%{transform:scale(1.08);box-shadow:0 4px 0 #14804a,0 0 26px #7dffa6}}
.btn.sel{outline:3px solid #fff}
#dlg{position:absolute;left:30px;right:30px;bottom:14px;background:rgba(8,20,42,.92);border:3px solid #ffd166;border-radius:18px;padding:16px 22px;min-height:96px;display:none;cursor:pointer}
#nm{position:absolute;top:-17px;left:22px;background:#ffd166;color:#4a2c00;font-weight:900;padding:2px 16px;border-radius:12px}
#tx{font-size:18px;line-height:1.5}
#nx{position:absolute;right:16px;bottom:6px;font-size:12px;opacity:.7;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.1}}
#pop{position:absolute;inset:0;background:rgba(5,12,28,.82);display:none;align-items:center;justify-content:center}
#pop .card{background:#fff7e0;color:#3a2a10;border-radius:20px;padding:24px 30px;max-width:640px;border:5px solid #c98a2b;box-shadow:0 10px 40px #000a}
#pop h2{color:#a8590a;margin-bottom:8px}#pop p{line-height:1.55;margin:6px 0}
.tag{display:inline-block;background:#ffd166;border-radius:20px;padding:3px 12px;font-weight:800;font-size:13px;margin:3px 3px 0 0}
</style></head><body>
<div id="stage"><canvas id="cv" width="960" height="540"></canvas>
<div class="hud" style="left:14px;top:12px"><div class="pill" id="hAct"></div><div class="pill">⭐ <span id="hSc">0</span></div></div>
<div class="hud" style="left:14px;top:58px"><button class="btn s" id="bExit">← Thoát</button><button class="btn s" id="bSnd">🔊</button></div><div class="hud" style="left:50%;top:12px;transform:translateX(-50%)"><div class="pill" id="meter"></div></div>
<div class="hud" style="right:14px;top:12px"><button class="btn s" id="bNote">📓 Sổ tay</button></div><div class="hud" id="boats" style="right:14px;top:60px"></div><button class="btn g go" id="bGo">⛵ XUẤT BẾN!</button>
<div id="dlg"><div id="nm"></div><div id="tx"></div><div id="nx">chạm để tiếp ▶</div></div>
<div id="pop"></div></div>
<script>
/* =========================================================
   GAME NHẬP VAI NGHỀ NGHIỆP v2 — engine + câu chuyện tách riêng
   Mỗi bài = 1 khối trong STORIES (cốt truyện + các chặng).
   ➜ THÊM BÀI MỚI: copy khối STORIES['luc-day-archimedes'], đổi lời thoại,
     số liệu (acts), loại hàng (crates). Engine bên dưới không cần sửa.
   Bài chưa có ở đây sẽ tự chuyển sang simulation_classic.html.
========================================================= */
const API=window.HOC_API_BASE||'http://127.0.0.1:8000/api',Q=new URLSearchParams(location.search),LESSON_ID=Q.get('lesson_id'),USER_ID=Number(localStorage.getItem('user_id'))||1;
const $=i=>document.getElementById(i),fmt=(n,d=1)=>Number(n).toLocaleString('vi-VN',{maximumFractionDigits:d});
const WHO={tu:'Bác Tư · chủ bến',na:'Bé Na',me:'Bạn · thuyền phó tập sự'};
const G=(n,m,k)=>({n,m,k}); // loại hàng
const GAO=G('Gạo',300,'🌾'),XM=G('Xi măng',500,'🧱'),TC=G('Trái cây',200,'🍉');
const cr=(...a)=>a.flatMap(([g,n])=>Array(n).fill(g));
const STORIES={'luc-day-archimedes':{
 title:'Thuyền chở hàng',
 acts:[
 {name:'Bến sông ngọt',env:'river',rho:1000,wave:.5,L:4,H:.6,minFree:.15,need:2000,boats:[{n:'Thuyền gỗ',w:2,hull:400}],crates:cr([GAO,4],[XM,4],[TC,4]),
  intro:[['me','Sáng sớm ở bến sông. Hôm nay là ngày đầu bạn đi làm thuyền phó.'],['tu','Chào chú nhóc! Có hợp đồng chở gạo, xi măng, trái cây ra chợ nổi: phải đủ ít nhất 2000 kg.'],['na','Mạn thuyền phải còn nhô lên mặt nước ít nhất 15 cm nha, không là sóng tạt vô hết đó!'],['tu','Kéo thùng hàng xuống thuyền. Vạch đỏ trên thân thuyền là mức nước tối đa. Xong thì bấm Xuất bến!']],
  win:[['tu','Êm re! Thuyền nặng cỡ cái nhà mà vẫn nổi, nhờ lực đẩy Archimedes đó.'],['na','Chuyến sau mình ra biển nha!']]},
 {name:'Ra biển lớn',env:'sea',rho:1025,wave:1.6,L:4,H:.6,minFree:.25,need:2500,boats:[{n:'Thuyền nhỏ',w:2,hull:400},{n:'Thuyền rộng',w:3,hull:520}],crates:cr([GAO,4],[XM,5],[TC,3]),
  intro:[['na','Ra biển rồi! Sóng lớn lắm, mạn thuyền phải cao ít nhất 25 cm. Hợp đồng lần này 2500 kg.'],['tu','Thuyền nhỏ chở nổi không nhỉ? Bên cạnh có thuyền rộng hơn, bấm chọn ở góc phải. Nước biển mặn nên đặc hơn nước sông đó.']],
  win:[['tu','Giỏi! Thuyền rộng chiếm chỗ nhiều nước hơn nên lực đẩy lớn hơn.'],['na','Giờ chạy vô sông giao nốt hàng thôi.']]},
 {name:'Vào cửa sông',env:'river',rhoFrom:1025,rho:1000,wave:.5,L:4,H:.55,minFree:.2,need:2800,boats:[{n:'Thuyền rộng',w:2.5,hull:450}],crates:cr([XM,4],[GAO,4],[TC,4]),preload:[0,1,2,3,4,5,6,8],
  intro:[['me','Thuyền đang chở đầy hàng từ biển, tiến vào cửa sông...'],['na','Ủa? Sao thuyền lún sâu xuống vậy? Nước sông nhạt nhẹ hơn nước biển đó!'],['tu','Nhanh lên! Dỡ bớt hàng xuống bến trước khi chìm, nhưng vẫn phải giữ ít nhất 2800 kg và mạn khô ≥ 20 cm!']],
  win:[['tu','Cứu được cả thuyền lẫn hàng. Chú nhóc đi làm được rồi đó!']]}],
 reveal:{formula:'FA = d · V   (thuyền nổi khi trọng lượng ≤ lực đẩy)',jobs:['Kỹ sư đóng tàu','Thuyền trưởng','Nhân viên cảng / kiểm định tải'],
  text:'Vạch tải trọng (Plimsoll) trên thân tàu thật chính là bài học này. Tàu từ biển vào sông phải chở ít hơn vì nước ngọt đẩy yếu hơn. Hiểu lực đẩy Archimedes giúp tính được tải an toàn trước khi nhận hàng.'}}};

/* ====================== ENGINE ====================== */
const ENV={river:{sky:['#7ec8ff','#fff1cf'],wat:['#3f9fd8','#1f6aa8'],hill:['#7fb77e','#5b9a6a']},sea:{sky:['#4a9be0','#ffcf9a'],wat:['#2a78b8','#0f4a82'],hill:['#6d8fb5','#4f6f99']}};
const S=200,BX0=380,BL=380,DY=392,WY=372,CS=44;
const cv=$('cv'),c=cv.getContext('2d'),stage=$('stage');
let story,st,score=0,sid=null,topic,P=[],T=0,dlgQ=[],dlgCB=null,typed=0,full='';
const rr=(x,y,w,h,r)=>{c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)};
async function api(p,o){const r=await fetch(API+p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw 0;return r.json()}
async function ev(a,d){if(!sid)return;try{await api(`/games/sessions/${sid}/events`,{method:'POST',body:JSON.stringify({action:a,event_data:JSON.stringify(d||{})})})}catch(e){}}
/* ===== ÂM THANH: tạo bằng WebAudio, không cần file mp3. Chỉnh âm lượng ở các số v / MUSIC_VOL ===== */
let AC,MG,lastAl=0,mute=localStorage.getItem('hdlg_mute')=='1';const MUSIC_VOL=.03;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=mute?0:1;MG.connect(AC.destination);ambient()}if(AC.state=='suspended')AC.resume();return AC}
function tone(f,d=.15,t='sine',v=.07,at=0,fe=0){const a=ac(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+at;o.type=t;o.frequency.setValueAtTime(f,s);if(fe)o.frequency.exponentialRampToValueAtTime(fe,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(MG);o.start(s);o.stop(s+d)}
function noise(d=.3,f=1200,v=.1,ty='lowpass'){const a=ac(),n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;s.buffer=b;fl.type=ty;fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(MG);s.start(t)}
function ambient(){const a=AC,n=a.sampleRate*3,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;x[i]=l*3.5}
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),o=a.createOscillator(),lg=a.createGain();s.buffer=b;s.loop=true;f.type='lowpass';f.frequency.value=600;g.gain.value=.55;o.frequency.value=.15;lg.gain.value=.3;o.connect(lg);lg.connect(g.gain);s.connect(f);f.connect(g);g.connect(MG);s.start();o.start();
 const sc=[523,587,659,784,880,784,659,587];let k=0;setInterval(()=>{if(mute)return;k=Math.max(0,Math.min(7,k+(Math.random()<.5?-1:1)));if(Math.random()<.7)tone(sc[k],1.1,'sine',MUSIC_VOL);if(Math.random()<.25)tone(sc[k]/2,1.6,'triangle',MUSIC_VOL*.8)},650);
 setInterval(()=>{if(!mute&&st&&st.a&&st.a.env=='sea'&&Math.random()<.5){tone(1500,.18,'sine',.03,0,1000);tone(1450,.22,'sine',.03,.22,900)}},6000)}
const SND={pick:()=>tone(430,.08,'triangle',.06),thud:()=>{tone(130,.14,'sine',.12,0,55);noise(.12,500,.1)},splash:()=>noise(.35,1800,.12,'bandpass'),
 talk:w=>tone(w=='tu'?140+Math.random()*30:w=='na'?330+Math.random()*50:240,.05,'triangle',.05),horn:()=>{tone(196,.8,'sawtooth',.07);tone(247,.8,'sawtooth',.05)},
 sink:()=>{noise(1.3,450,.14);tone(320,1.2,'sine',.08,0,60);splash(0,0,0)},alarm:()=>tone(880,.12,'square',.035),fail:()=>tone(230,.45,'sawtooth',.06,0,110),
 note:()=>{tone(880,.1,'sine',.06);tone(1175,.16,'sine',.06,.1)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i==3?.5:.16,'triangle',.08,i*.13))};
addEventListener('pointerdown',()=>ac(),{once:true});addEventListener('keydown',()=>ac(),{once:true});
function fit(){const s=Math.min(innerWidth/960,innerHeight/540);stage.style.transform=`translate(${(innerWidth-960*s)/2}px,${(innerHeight-540*s)/2}px) scale(${s})`;stage._s=s}
addEventListener('resize',fit);fit();

/* ---- vật lý: mớn nước = khối lượng / (d·L·W) ---- */
const boat=()=>st.a.boats[st.b];
function phys(rho=st.rho){const a=st.a,b=boat(),load=st.cr.filter(x=>x.loc=='boat').reduce((s,x)=>s+x.g.m,0),m=b.hull+load,dr=m/(rho*a.L*b.w),free=a.H-dr;return{load,m,dr,free,fa:rho*10*a.L*b.w*a.H,max:rho*a.L*b.w*(a.H-a.minFree)-b.hull}}
const dockPos=k=>({x:170+(k%4)*46,y:DY-CS*(1+(k/4|0))-2});
const boatPos=(k,dy)=>({x:st.ox+14+(k%8)*46,y:dy-CS*(1+(k/8|0))});
function free(loc){const u=new Set(st.cr.filter(x=>x.loc==loc).map(x=>x.slot));let k=0;while(u.has(k))k++;return k}
function put(x,loc){x.loc=loc;x.slot=free(loc)}
function newAct(i,re){const a=story.acts[i];st={i,a,b:0,cr:a.crates.map((g,k)=>({g,k,loc:'dock',slot:k,x:dockPos(k).x,y:dockPos(k).y})),rho:a.rhoFrom||a.rho,dr:0,sink:0,off:0,ox:BX0,mode:'talk',tries:st.i===i?st.tries:0,hints:st.i===i?st.hints:0,noted:false};
 (a.preload||[]).forEach(k=>put(st.cr[k],'boat'));st.dr=phys().dr;buildHud();if(re){st.mode='play';hud()}else say(a.intro,()=>{st.mode='play';hud()})}
function buildHud(){const a=st.a;$('hAct').textContent=`Chặng ${st.i+1}/${story.acts.length} · ${a.name}`;$('boats').innerHTML=a.boats.length>1?'<span class="pill" style="font-size:12px">Chọn thuyền:</span>'+a.boats.map((b,k)=>`<button class="btn s ${k==st.b?'sel':''}" data-k="${k}">${b.n} (${b.w}m)</button>`).join(''):'';
 document.querySelectorAll('#boats button').forEach(e=>e.onclick=()=>{if(st.mode!='play')return;st.b=+e.dataset.k;SND.pick();ev('change_parameter',{boat:st.b});buildHud()});$('hSc').textContent=score}
function hud(){const p=phys(),a=st.a,ok=p.free>=a.minFree,enough=p.load>=a.need;$('bGo').classList.toggle('ready',ok&&enough);$('meter').innerHTML=`Hàng <b style="color:${enough?'#7dffa6':'#ffd166'}">${p.load}</b>/${a.need} kg · Mạn khô <b style="color:${ok?'#7dffa6':'#ff7b7b'}">${fmt(p.free*100)}</b> cm (≥${a.minFree*100})`}

/* ---- hội thoại kiểu visual novel ---- */
function say(lines,cb){dlgQ=lines.slice();dlgCB=cb;$('dlg').style.display='block';st.mode='talk';next()}
function next(){if(typed<full.length){typed=full.length;return show()}const l=dlgQ.shift();if(!l){$('dlg').style.display='none';const f=dlgCB;dlgCB=null;f&&f();return}st.who=l[0];$('nm').textContent=WHO[l[0]];full=l[1];typed=0}
const show=()=>$('tx').textContent=full.slice(0,Math.floor(typed));
$('dlg').onclick=next;addEventListener('keydown',e=>{if(e.key==' '||e.key=='Enter')next()});

/* ---- kéo thả thùng hàng ---- */
let drag=null;
const pt=e=>{const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/stage._s,y:(e.clientY-r.top)/stage._s}};
cv.onpointerdown=e=>{if(st.mode!='play')return;const m=pt(e);for(let k=st.cr.length-1;k>=0;k--){const x=st.cr[k];if(m.x>x.x&&m.x<x.x+CS&&m.y>x.y&&m.y<x.y+CS){drag={x,dx:m.x-x.x,dy:m.y-x.y};x.drag=1;cv.setPointerCapture(e.pointerId);SND.pick();return}}};
cv.onpointermove=e=>{if(!drag)return;const m=pt(e);drag.x.x=m.x-drag.dx;drag.x.y=m.y-drag.dy};
cv.onpointerup=()=>{if(!drag)return;const x=drag.x,cx=x.x+CS/2,cy=x.y+CS/2;x.drag=0;drag=null;const over=cx>st.ox-10&&cx<st.ox+BL+10&&cy>WY-170&&cy<WY+120;const was=x.loc;
 if(over){if(was!='boat')put(x,'boat')}else if(was!='dock')put(x,'dock');
 if(x.loc!=was){over?SND.thud():SND.pick();over&&SND.splash();splash(x.x+22,WY,6);ev('change_parameter',{crate:x.g.n,to:x.loc,...(({load,free})=>({load,free:+free.toFixed(3)}))(phys())})}hud()};

/* ---- xuất bến + hậu quả ---- */
$('bGo').onclick=()=>{if(st.mode!='play')return;const p=phys(),a=st.a;st.res=p;$('dlg').style.display='none';
 if(p.free<a.minFree){st.mode='sink';SND.sink()}else if(p.load<a.need){st.mode='back';st.dir=1;SND.horn()}else{st.mode='go';SND.horn()}};
function after(){const p=st.res,a=st.a,tries=++st.tries;
 if(st.mode=='win'){SND.win();const g=Math.max(30,100-(tries-1)*15-st.hints*10);score+=g;$('hSc').textContent=score;ev('success',{act:st.i,tries,hints:st.hints});
  say([...a.win,['me',`+${g} điểm`]],()=>st.i+1<story.acts.length?newAct(st.i+1):finish());return}
 SND.fail();ev('wrong_answer',{act:st.i,tries,load:p.load,free:+p.free.toFixed(3)});ev('retry',{act:st.i});
 const msg=p.free<0?`Chìm rồi! Trọng lượng ${fmt(p.m*10/1000)} kN lớn hơn lực đẩy tối đa ${fmt(p.fa/1000)} kN, nước tràn vào thuyền.`:p.free<a.minFree?`Mạn khô chỉ còn ${fmt(p.free*100)} cm, thấp hơn mức an toàn ${a.minFree*100} cm. Sóng tạt vô là thuyền ngập!`:`Thuyền an toàn nhưng chỉ chở ${p.load} kg, chưa đủ ${a.need} kg theo hợp đồng, chuyến này lỗ vốn.`;
 const keep=st.tries,kh=st.hints;say([['tu',msg],['na','Thử lại nha! Coi vạch đỏ trên thân thuyền và đồng hồ phía trên.']],()=>{st.tries=keep;st.hints=kh;const i=st.i;newAct(i,1)})}
$('bNote').onclick=()=>{if(st.mode!='play')return;const p=phys(),a=st.a,b=boat();if(!st.noted){st.noted=1;const t=+localStorage.getItem('hdlg_hints')||0;if(t>0)localStorage.setItem('hdlg_hints',t-1);else st.hints++}ev('hint',{act:st.i});SND.note();
 $('pop').style.display='flex';$('pop').innerHTML=`<div class="card"><h2>📓 Sổ tay thuyền phó</h2><p>Lực đẩy Archimedes: <b>FA = d · V</b>, với d = 10 × khối lượng riêng nước.</p><p>Thuyền nổi khi <b>trọng lượng ≤ FA</b>. Phần chìm sâu bao nhiêu thì tính từ <b>mớn nước = khối lượng ÷ (ρ · dài · rộng)</b>.</p><p>Nước ở đây ρ = <b>${fmt(st.rho,0)}</b> kg/m³, thuyền dài ${a.L} m, rộng ${b.w} m.</p><p>➜ Hàng tối đa để còn mạn khô ${a.minFree*100} cm: <b>${fmt(p.max,0)} kg</b></p><p style="margin-top:12px"><button class="btn" onclick="$('pop').style.display='none'">Đã hiểu</button></p></div>`};
function exitGame(){history.length>1?history.back():location.href='../index.html'}
function askExit(){if(st.mode=='end')return exitGame();$('pop').style.display='flex';$('pop').innerHTML=`<div class="card"><h2>Thoát khỏi game?</h2><p>Tiến trình của chặng hiện tại sẽ không được lưu.</p><p style="margin-top:12px"><button class="btn g" onclick="$('pop').style.display='none'">▶ Chơi tiếp</button> <button class="btn" onclick="ev('exit',{act:st.i,score});exitGame()">Thoát</button></p></div>`}
$('bExit').onclick=askExit;$('bSnd').textContent=mute?'🔇':'🔊';$('bSnd').onclick=()=>{mute=!mute;localStorage.setItem('hdlg_mute',mute?'1':'0');$('bSnd').textContent=mute?'🔇':'🔊';if(MG)MG.gain.value=mute?0:1;ac()};addEventListener('keydown',e=>{if(e.key=='Escape')askExit()});
function finish(){st.mode='end';SND.win();const r=story.reveal;if(sid)api(`/games/sessions/${sid}/finish?score=${score}`,{method:'POST'}).catch(()=>{});

/* ---- hạt: bọt nước, pháo giấy ---- */
function splash(x,y,n,col='rgba(255,255,255,.85)',up=3){for(let i=0;i<n;i++)P.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*up-1,l:40+Math.random()*20,col,r:2+Math.random()*3})}
function confetti(){for(let i=0;i<60;i++)P.push({x:480+(Math.random()-.5)*300,y:60,vx:(Math.random()-.5)*5,vy:Math.random()*2,l:120,col:`hsl(${Math.random()*360},90%,60%)`,r:4,g:.08})}

function person(x,y,o,talk,hot){c.save();c.translate(x,y+Math.sin(T*2+o.ph)*(hot?3:1.5));const s=o.s*(hot?1.06:1);c.scale(s,s);c.globalAlpha=hot||!st.who?1:.78;
 c.fillStyle='#2f4a6b';c.fillRect(-13,-40,10,40);c.fillRect(3,-40,10,40);c.fillStyle=o.shirt;rr(-18,-94,36,58,9);c.fill();
 c.fillStyle=o.skin;c.beginPath();c.arc(0,-110,18,0,7);c.fill();c.fillRect(-26,-88,8,26);c.fillRect(18,-88,8,26);
 c.fillStyle='#2b1d10';c.beginPath();c.arc(-6,-112,2.4,0,7);c.arc(6,-112,2.4,0,7);c.fill();
 c.strokeStyle='#7a3b2a';c.lineWidth=2;c.beginPath();talk?c.ellipse(0,-102,4,2+Math.abs(Math.sin(T*14))*3,0,0,7):(c.moveTo(-5,-102),c.quadraticCurveTo(0,-98,5,-102));c.stroke();
 if(o.hat){c.fillStyle='#e8d28a';c.beginPath();c.moveTo(-36,-118);c.lineTo(36,-118);c.lineTo(0,-158);c.closePath();c.fill();c.strokeStyle='#b99a4a';c.stroke()}
 else{c.fillStyle='#2b1d10';c.beginPath();c.arc(0,-116,19,Math.PI,0);c.fill();c.beginPath();c.arc(-22,-100,7,0,7);c.arc(22,-100,7,0,7);c.fill()}c.restore()}
function crate(x,o,y){c.fillStyle={Gạo:'#d9b26a','Xi măng':'#9aa3ad','Trái cây':'#e0805f'}[o.g.n];rr(x,y,CS,CS,5);c.fill();c.strokeStyle='#5a3a16';c.lineWidth=3;c.stroke();c.fillStyle='rgba(90,58,22,.35)';c.fillRect(x,y+CS/2-3,CS,6);c.font='19px serif';c.textAlign='center';c.fillStyle='#000';c.fillText(o.g.k,x+CS/2,y+23);c.font='bold 11px Arial';c.fillStyle='#2b1d10';c.fillText(o.g.m,x+CS/2,y+39)}
function wave(y,amp,col,ph){c.fillStyle=col;c.beginPath();c.moveTo(0,540);for(let x=0;x<=960;x+=12)c.lineTo(x,y+Math.sin(x*.025+T*1.5+ph)*amp);c.lineTo(960,540);c.fill()}
const PEO=[{x:58,ph:0,s:1,shirt:'#c0392b',skin:'#e0ac80',hat:1,id:'tu'},{x:118,ph:2,s:.82,shirt:'#f4a3c0',skin:'#e8b890',hat:0,id:'na'}];
function draw(){const a=st.a,e=ENV[a.env],amp=a.wave*4;c.clearRect(0,0,960,540);
 let g=c.createLinearGradient(0,0,0,340);g.addColorStop(0,e.sky[0]);g.addColorStop(1,e.sky[1]);c.fillStyle=g;c.fillRect(0,0,960,540);
 c.fillStyle='rgba(255,240,170,.9)';c.beginPath();c.arc(780,a.env=='sea'?210:110,38,0,7);c.fill();c.fillStyle='rgba(255,240,170,.25)';c.beginPath();c.arc(780,a.env=='sea'?210:110,70,0,7);c.fill();
 c.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<4;i++){const x=((i*290+T*8*(1+i*.2))%1200)-120,y=50+i*38;c.beginPath();c.arc(x,y,24,0,7);c.arc(x+28,y+4,30,0,7);c.arc(x+58,y,22,0,7);c.fill()}
 c.fillStyle=e.hill[0];c.beginPath();c.moveTo(0,340);for(let x=0;x<=960;x+=20)c.lineTo(x,290-Math.sin(x*.012)*28-Math.sin(x*.03)*10);c.lineTo(960,340);c.fill();
 c.fillStyle=e.hill[1];c.beginPath();c.moveTo(0,350);for(let x=0;x<=960;x+=20)c.lineTo(x,322-Math.sin(x*.02+2)*14);c.lineTo(960,350);c.fill();
 g=c.createLinearGradient(0,330,0,540);g.addColorStop(0,e.wat[0]);g.addColorStop(1,e.wat[1]);c.fillStyle=g;c.fillRect(0,336,960,204);wave(WY+6,amp*.7,'rgba(255,255,255,.18)',1);
 // thuyền
 const b=boat(),bob=Math.sin(T*1.6)*amp*.8,dr=st.dr+st.sink*a.H*1.25,dyk=WY+bob,deck=dyk-(a.H-dr)*S;st.ox=BX0+st.off;const ox=st.ox,tilt=Math.sin(T*1.3)*.02*(1+a.wave);
 c.save();c.translate(ox+BL/2,dyk);c.rotate(tilt);c.translate(-(ox+BL/2),-dyk);
 const keel=deck+a.H*S;c.fillStyle='#9a5f2e';c.beginPath();c.moveTo(ox-14,deck);c.lineTo(ox+BL+14,deck);c.lineTo(ox+BL-30,keel);c.lineTo(ox+36,keel);c.closePath();c.fill();c.strokeStyle='#5c3516';c.lineWidth=4;c.stroke();
 c.fillStyle='rgba(60,30,10,.25)';for(let k=1;k<4;k++)c.fillRect(ox+20+k*5,deck+k*a.H*S/4-2,BL-40-k*10,3);
 c.fillStyle='#f4efe2';rr(ox+BL-90,deck-52,78,52,6);c.fill();c.stroke();c.fillStyle='#7fc6ff';c.fillRect(ox+BL-78,deck-38,24,18);c.fillRect(ox+BL-48,deck-38,24,18);c.fillStyle='#c0392b';c.fillRect(ox+BL-56,deck-80,3,28);c.fillRect(ox+BL-53,deck-80,22,12);
 const ly=deck+a.minFree*S;c.strokeStyle='#e33';c.lineWidth=3;c.setLineDash([10,6]);c.beginPath();c.moveTo(ox-6,ly);c.lineTo(ox+BL+6,ly);c.stroke();c.setLineDash([]);c.fillStyle='#e33';c.font='bold 11px Arial';c.textAlign='left';c.fillText('VẠCH TẢI TỐI ĐA',ox+46,ly-4);
 st.cr.filter(x=>x.loc=='boat'&&!x.drag).forEach(x=>{if(st.mode=='sink'){x.y+=(WY-26+Math.sin(T*2+x.k)*5-x.y)*.04;x.x+=Math.sin(x.k)*.8}else{const t=boatPos(x.slot,deck);x.x+=(t.x-x.x)*.3;x.y+=(t.y-x.y)*.3}crate(x.x,x,x.y)});c.restore();
 wave(WY,amp,'rgba(40,130,200,.55)',0);wave(WY+14,amp*1.2,'rgba(20,90,160,.5)',2);
 // bến + người
 c.fillStyle='#8d6a3a';c.fillRect(0,DY,350,16);c.fillStyle='#6d4f27';c.fillRect(0,DY+16,350,10);c.fillStyle='#4e381b';[30,150,270].forEach(x=>c.fillRect(x,DY+26,14,150));
 st.cr.filter(x=>x.loc=='dock'&&!x.drag).forEach(x=>{const t=dockPos(x.slot);x.x+=(t.x-x.x)*.3;x.y+=(t.y-x.y)*.3;crate(x.x,x,x.y)});
 PEO.forEach(o=>person(o.x,DY,o,st.mode=='talk'&&st.who==o.id&&typed<full.length,st.mode=='talk'&&st.who==o.id));
 if(st.mode=='play'&&phys().free<a.minFree&&phys().free>=0){c.fillStyle=`rgba(255,60,60,${.18+.12*Math.sin(T*8)})`;c.fillRect(0,0,960,540)}
 if(drag)crate(drag.x.x,drag.x,drag.x.y);
 P=P.filter(p=>p.l-->0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||.15;c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill()})}

/* ---- vòng lặp ---- */
let last=0;function loop(t){T=t/1000;const a=st.a,p=phys();$('bGo').style.display=st.mode=='play'?'block':'none';
 if((st.mode=='play'||(st.mode=='talk'&&a.rhoFrom&&dlgQ.length<2))&&st.rho!=a.rho){st.rho+=(a.rho-st.rho)*.012;if(Math.abs(st.rho-a.rho)<.5)st.rho=a.rho;hud()}
 st.dr+=(p.dr-st.dr)*.07;if(st.mode=='play'&&p.free<a.minFree&&p.free>=0&&Math.floor(T*3)%2==0&&Math.floor(T*3)!=lastAl){lastAl=Math.floor(T*3);SND.alarm()}if(typed<full.length){const b4=Math.floor(typed);typed+=.9;if(Math.floor(typed)!=b4&&b4%2==0&&full[b4]!=' ')SND.talk(st.who);show()}
 if(st.mode=='sink'){st.sink+=.011;if(Math.random()<.5)splash(st.ox+60+Math.random()*260,WY,2,undefined,2);if(st.sink>(st.res.free<0?1.05:.75)){st.sink=0;after()}}
 else if(st.mode=='go'){st.off+=4;if(st.off==40||st.off==44)confetti();if(st.off>560){st.mode='win';after()}}
 else if(st.mode=='back'){st.off+=3*st.dir;if(st.off>150)st.dir=-1;if(st.off<=0){st.off=0;st.mode='lose';after()}}
 draw();requestAnimationFrame(loop)}
